 return new Promise(res=>{alert('Pick your current index.html file so the changes can be written into a copy of it.');const f=document.createElement('input');f.type='file';f.accept='.html,text/html';f.onchange=()=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsText(f.files[0])};f.click()})}
function mk(src){S.an=AN.map(a=>({...a}));S.rev=Date.now();const e=o=>JSON.stringify(o).replace(/</g,'\\u003c'),rp=(s,id,o)=>s.replace(new RegExp('(<script id="'+id+'" type="application/json">)[\\s\\S]*?(<\/script>)'),(m,a,b)=>a+e(o)+b);return rp(rp(src,'pb-baked',S),'d',{products:P,issues:D.issues})}
async function saveHtml(){const out=mk(await getSrc());persist();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);openAdmin('st')}
const bkObj=()=>{S.an=jc(AN);return{v:2,exported:new Date().toISOString(),S,K:{p:P,i:D.issues}}};
function exportJson(){persist();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(bkObj())],{type:'application/json'}));a.download='performance-booster-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function importJson(txt){const v=JSON.parse(txt);if(!v||!v.S||typeof v.S!=='object')throw Error('This is not a Performance Booster backup.');
 applyRec(v);S.log=S.log||[];if(Array.isArray(S.an))AN=S.an.map(a=>({...a}));anSave();commit();persist();return true}
const bkMsg=t=>{const m=$('bkm');if(m)m.textContent=t;try{alert(t)}catch(e){}};
function stTab(){let pv=null;try{pv=JSON.parse(ls.get('pb-saved-prev'))}catch(e){}
 ac.innerHTML='<div class="card"><b>💾 Saved on this device</b><div class="mu" style="margin:6px 0" id="svs">'+svLine()+'</div><div class="row"><button class="chip on" data-x="sv">💾 Save now</button></div><div class="mu">Every edit saves automatically and stays after refresh or restart, in this browser on this device. Other devices get your work through the backup file below.</div></div>'
 +(pv&&pv.S?'<div class="card" style="border-color:#e6a100"><b>🕘 Older saved copy found</b><div class="mu" style="margin:6px 0">A newer HTML file replaced the copy you saved here on '+anWhen(pv.t)+'. You can bring it back.</div><button class="chip" data-x="rpv">Restore that copy</button></div>':'')
 +'<div class="card"><b>🧳 Backup &amp; restore (JSON)</b><div class="mu" style="margin:6px 0">Export your work to a file. Importing it on any device or browser saves it there permanently.</div><div class="row"><button class="chip on" data-x="ex">⬇️ Export JSON file</button><button class="chip" data-x="imf">⬆️ Import JSON file</button><button class="chip" data-x="exc">📋 Copy JSON</button></div><input type="file" id="bkf" accept=".json,application/json" style="display:none"><div id="bkm" style="font-weight:600;min-height:20px;margin-top:8px"></div><textarea id="bk" rows="4" placeholder="Or paste backup JSON here, then press Import pasted JSON."></textarea><div class="row"><button class="chip" data-x="im">Import pasted JSON</button></div></div>'
 +'<div class="card"><b>🏷️ Title</b><div class="fld"><input id="tt" placeholder="Title" value="'+H(S.title||document.querySelector('.hero h1').textContent)+'"></div><div class="fld"><input id="ts" placeholder="Subtitle" value="'+H(S.sub||document.querySelector('.hero .sub').textContent)+'"></div><button class="chip" data-x="ti">Apply</button></div>'
 +'<div class="card"><b>🔑 Admin password</b><div class="fld"><input id="np" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password"></div><button class="chip" data-x="pw">Change password</button><div class="mu" style="margin-top:6px">Note: this is a convenience lock stored inside the HTML. It keeps casual users out, but anyone who edits the file can bypass it.</div></div>'
 +'<div class="card"><b>🌐 Share with everyone (advanced)</b><div class="mu" style="margin:6px 0">Creates a new index.html with all your changes inside. Upload it to replace the old file so every viewer gets them.</div><button class="chip" data-x="dl">⬇️ Download updated index.html</button></div>'
 +'<div class="card"><b>♻️ Reset</b><div class="mu" style="margin:6px 0">Erases your saved changes on this device and returns to the original file.</div><button class="chip no" data-x="rs">Reset to original file</button></div>';
 $('bkf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(importJson(await f.text())){stTab();bkMsg('✅ Imported'+(storeOk?' and saved permanently on this device.':' for this session. Storage is blocked here, so import it again next time.'))}}catch(er){bkMsg('❌ Invalid backup file: '+er.message)}};
 ac.onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;const k=b.dataset.x;
  if(k==='sv'){persist();$('svs').textContent=svLine()}
  else if(k==='dl')saveHtml();
  else if(k==='ex')exportJson();
  else if(k==='exc'){persist();const t=JSON.stringify(bkObj());$('bk').value=t;$('bk').select();try{navigator.clipboard.writeText(t).then(()=>alert('Backup JSON copied.'),()=>{})}catch(er){}}
  else if(k==='imf')$('bkf').click();
  else if(k==='im'){try{if(importJson($('bk').value)){stTab();bkMsg('✅ Imported'+(storeOk?' and saved permanently on this device.':' for this session. Storage is blocked here, so import it again next time.'))}}catch(er){bkMsg('❌ Invalid JSON: '+er.message)}}
  else if(k==='rpv'){try{const r=JSON.parse(ls.get('pb-saved-prev'));if(confirm('Restore the copy saved '+anWhen(r.t)+'?')){applyRec(r);if(Array.isArray(S.an))AN=S.an.map(a=>({...a}));anSave();commit();persist();ls.del('pb-saved-prev');stTab()}}catch(er){alert(er.message)}}
  else if(k==='ti'){S.title=$('tt').value.trim();S.sub=$('ts').value.trim();commit();stTab()}
  else if(k==='pw'){const v=$('np').value;if(v.length<6)return alert('Use at least 6 characters.');S.pw=h53(v);commit();alert('Password changed and saved.');stTab()}
  else if(k==='rs'&&confirm('Erase all saved changes on this device and go back to the original file?')){ls.del(KEY);ls.del(KEY2);ls.del('pb-saved-prev');try{indexedDB.deleteDatabase('pb-store')}catch(er){}location.reload()}}}
/* ---- “Edit this” shortcut on result cards in Admin view ---- */
const r0=render;render=function(){r0();document.querySelectorAll('[data-ae]').forEach(x=>x.remove());const c=document.querySelector('#main .card.res');if(!c||q.trim().length>1)return;const p=P[tab],i=p.entries.findIndex(e=>e.path.every((v,k)=>v===sel[k]));if(i<0)return;const l=(S.log||[]).slice().reverse().find(x=>x.k===p.name+'|'+p.entries[i].path.join('›'));if(l){const d=document.createElement('div');d.className='mu';d.style.marginTop='8px';d.textContent='🕒 Updated '+anWhen(l.t)+' by '+l.w;c.append(d)}if(!adm)return;const b=document.createElement('button');b.className='chip';b.type='button';b.dataset.ae=tab+':'+i;b.textContent='✏️ Edit (admin)';c.append(' ',b)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-ae]');if(!b)return;const[a,i]=b.dataset.ae.split(':');kp=+a;ke=+i;openAdmin('kn')});
/* ---- Simulation tool window ---- */
window.initSim=root=>{const box=root.querySelector('[data-r="sim"]');let g=null,pf='All';
 const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},res=()=>{try{return JSON.parse(ls.get('pb-simres')||'{}')}catch(e){return{}}};
 const menu=()=>{g=null;const r=res(),ps=['All',...new Set(S.scen.map(x=>x.p))],all=S.scen.reduce((n,x)=>n+x.s.length,0);box.innerHTML='<div class="mu" style="margin-bottom:8px">Practice real customer chats. Pick an answer, get instant feedback.</div><div class="fld"><select data-s="pf">'+ps.map(p=>'<option'+(p===pf?' selected':'')+'>'+H(p)+'</option>').join('')+'</select></div><div class="row"><button class="chip on" data-s="rand">🎲 Random</button><button class="chip" data-s="mix">🔀 Mixed quiz ('+Math.min(10,all)+')</button></div>'+(S.scen.map((x,i)=>pf==='All'||x.p===pf?'<div class="card"><span class="pill">'+H(x.p)+'</span> <b>'+H(x.t)+'</b><div class="mu">'+H(x.d)+' · '+x.s.length+' steps'+(r[x.id]!=null?' · 🏅 Best '+r[x.id]+'%':'')+'</div><button class="chip" data-s="go" data-i="'+i+'" style="margin-top:8px">▶ Start</button></div>':'').join('')||'<div class="hint">No scenarios yet — admins can add them in the Admin Console.</div>')};
 const start=sc=>{g={sc,i:0,a:[],cur:null};draw()};
 const draw=()=>{const sc=g.sc,n=sc.s.length;if(g.i>=n)return end();const s=sc.s[g.i];if(!g.cur||g.cur.i!==g.i)g.cur={i:g.i,o:sh(s.o.map((t,j)=>({t,ok:j===s.a}))),p:null};const c=g.cur,d=c.p!=null;
  box.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px"><span class="pill">'+H(sc.t)+'</span><b>'+(g.i+1)+'/'+n+'</b></div><div class="card"><div class="lbl">💬 Customer / situation</div><div class="fc-q">'+H(s.c||s.q)+'</div></div><b>'+H(s.q)+'</b><div class="fc-o" style="flex-direction:column;margin-top:8px">'+c.o.map((o,j)=>'<button class="chip" data-s="pick" data-v="'+j+'"'+(d?' disabled':'')+' style="text-align:left;width:100%;font-size:14px;font-weight:500'+(d?(o.ok?';background:#0b8a55;color:#fff':j===c.p?';background:#e03131;color:#fff':''):'')+'">'+H(o.t)+'</button>').join('')+'</div>'+(d?'<div class="card res"><b>'+(c.o[c.p].ok?'✅ Correct':'❌ Not quite')+'</b><div class="txt">'+H(s.e||'')+'</div></div><button class="chip on" data-s="next" style="width:100%">'+(g.i+1<n?'Next →':'Finish')+'</button>':'')};
 const end=()=>{const n=g.sc.s.length,r=g.a.filter(Boolean).length,pc=Math.round(r/n*100),rs=res();if(g.sc.id&&(rs[g.sc.id]==null||pc>rs[g.sc.id])){rs[g.sc.id]=pc;try{ls.set('pb-simres',JSON.stringify(rs))}catch(e){}}
  box.innerHTML='<div class="card res"><div class="lbl">🏁 Complete</div><div class="clk">'+r+' / '+n+'</div><div class="mu">'+pc+'% · '+(pc===100?'🏆 Perfect!':pc>=70?'👏 Solid work':'📖 Review the misses below')+'</div></div>'+g.sc.s.map((s,i)=>g.a[i]?'':'<div class="card" style="border-left:4px solid #e03131"><b>❌ '+H(s.q)+'</b><div class="mu">Best answer: '+H(s.o[s.a])+'</div><div class="txt">'+H(s.e||'')+'</div></div>').join('')+'<div class="row"><button class="chip on" data-s="again">↻ Retry</button><button class="chip" data-s="menu">☰ Menu</button></div>'};
 box.onchange=e=>{if(e.target.dataset.s==='pf'){pf=e.target.value;menu()}};
 box.onclick=e=>{const b=e.target.closest('button[data-s]');if(!b)return;const k=b.dataset.s,L=S.scen.filter(x=>pf==='All'||x.p===pf);
  if(k==='go')start(S.scen[+b.dataset.i]);else if(k==='rand'){if(L.length)start(L[Math.random()*L.length|0])}
  else if(k==='mix'){const st=sh(S.scen.flatMap(x=>x.s)).slice(0,10);if(st.length)start({id:null,t:'Mixed quiz',s:st})}
  else if(k==='pick'){g.cur.p=+b.dataset.v;g.a[g.i]=g.cur.o[g.cur.p].ok;draw()}else if(k==='next'){g.i++;draw()}else if(k==='again')start(g.sc);else if(k==='menu')menu()};
 menu()};
