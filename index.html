<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Performance Booster</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2fb;
  --card:rgba(255,255,255,.74);
  --card2:rgba(255,255,255,.93);
  --tx:#14203a;
  --mu:#5a6785;
  --bd:rgba(20,32,70,.13);
  --grid:rgba(30,50,110,.05);
  --gs:16%;
  --sh:0 8px 30px rgba(20,40,100,.10);
  --ac:#2f6bff;
  --ac2:#5b5bf0;
  --sidebar-w: 240px;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: auto;
  overflow-y: auto;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a1020;
    --card:rgba(22,30,54,.68);
    --card2:rgba(34,45,78,.9);
    --tx:#e9eefc;
    --mu:#9aa8c9;
    --bd:rgba(150,170,255,.17);
    --grid:rgba(160,180,255,.045);
    --gs:30%;
    --sh:0 10px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1020;
  --card:rgba(22,30,54,.68);
  --card2:rgba(34,45,78,.9);
  --tx:#e9eefc;
  --mu:#9aa8c9;
  --bd:rgba(150,170,255,.17);
  --grid:rgba(160,180,255,.045);
  --gs:30%;
  --sh:0 10px 34px rgba(0,0,0,.45);
}
:root[data-a="violet"]{--ac:#7048e8;--ac2:#a23de0}
:root[data-a="emerald"]{--ac:#0b8a55;--ac2:#0a8f8f}
:root[data-a="sunset"]{--ac:#d9480f;--ac2:#e8590c}
:root[data-a="yellow"]{--ac:#e6a100;--ac2:#f59f00}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--tx);
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-width: 320px;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60rem 40rem at 8% -10%,color-mix(in srgb,var(--ac) var(--gs),transparent),transparent 60%),
             radial-gradient(50rem 40rem at 100% 100%,color-mix(in srgb,var(--ac2) var(--gs),transparent),transparent 60%),
             linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,
             linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px;
}

/* Scrollbars styling */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.05);
}
::-webkit-scrollbar-thumb {
  background: var(--bd);
  border-radius: 5px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--ac);
}

.w{
  width:100%;
  max-width: 100%;
  margin:0 auto;
  padding:18px 24px 40px;
  transition: padding-left 0.3s ease;
}

/* Sidebar Toggle & Drawer */
.sidebar-toggle-btn {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10001;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: var(--card2);
  color: var(--tx);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: var(--sh);
  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, background-color 0.2s ease;
}
.sidebar-toggle-btn:hover {
  border-color: var(--ac);
  transform: translateY(-1px);
}

.left-sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  z-index: 10000;
  background: var(--card2);
  border-right: 1px solid var(--bd);
  backdrop-filter: blur(16px);
  box-shadow: 4px 0 25px rgba(0,0,0,0.15);
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  padding: 60px 12px 20px 12px;
  overflow-y: auto;
}
.left-sidebar.open {
  transform: translateX(0);
}

.sidebar-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mu);
  margin-bottom: 12px;
  padding-left: 6px;
}

.sidebar-tools-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.hero{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px 20px;
  margin-top: 36px;
  border:1px solid var(--bd);
  border-radius:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),var(--card);
  backdrop-filter:blur(14px);
  box-shadow:var(--sh);
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 45%,transparent);
}
h1{font-size:21px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mu);font-size:13px}
.ctl{display:flex;align-items:center;gap:12px}
#dots{display:flex;gap:8px}
.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;font-size:17px;display:grid;place-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer}
.dot.on{outline:2px solid var(--tx);outline-offset:2px}

.srch,.amt{position:relative}
.srch{margin:16px 0 4px}
.srch span,.amt span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
input,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card2);color:var(--tx);font:inherit}
input[type=search]{-webkit-appearance:none;appearance:none;padding-left:42px}
.amt input{padding-left:30px}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Tabs with horizontal scrollable bar */
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  white-space: nowrap;
  padding:8px 2px 12px;
  margin-top:6px;
  scrollbar-width: auto;
}
.tab{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border:1px solid var(--bd);
  border-radius:14px;
  background:var(--card);
  backdrop-filter:blur(10px);
  color:var(--tx);
  font:inherit;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
}
.tab span{font-size:18px}
.tab:hover,.chip:hover{border-color:var(--ac)}
.tab.on,.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.tab.on{box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 40%,transparent)}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.fld{margin:8px 0 14px}
.chip{padding:9px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
.lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-top:10px}
.n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;backdrop-filter:blur(14px);box-shadow:var(--sh)}
.res{border-left:4px solid var(--ac);animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:color-mix(in srgb,var(--ac) 60%,var(--tx));background:color-mix(in srgb,var(--ac) 14%,transparent)}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:12px}
.hit{display:block;width:100%;text-align:left;cursor:pointer;color:var(--tx);font:inherit;transition:.15s}
.hit:hover{border-color:var(--ac);transform:translateY(-1px)}
.mu{color:var(--mu);font-size:13px}
a{color:color-mix(in srgb,var(--ac) 60%,var(--tx))}
mark{background:color-mix(in srgb,var(--ac) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.hint{text-align:center;color:var(--mu);padding:22px 10px;border:1px dashed var(--bd);border-radius:16px;margin-top:8px}
.cp{margin-top:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--card2)}
.st b{display:block;font-size:22px;margin-top:2px}
.st.big{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.st.big .mu{color:rgba(255,255,255,.88)}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:28px}

#scene{position:fixed;inset:0;z-index:-1;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
.sa{fill:var(--ac)}.sb{fill:var(--ac2)}.sc{fill:var(--tx)}
.bl{animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-24px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.clk{font-weight:700;font-size:40px;line-height:1.1;margin:10px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tool-win .tw-m{padding:4px 12px;font-weight:bold;font-size:16px;cursor:pointer}
#dock{position:fixed;left:8px;bottom:8px;z-index:10003;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 16px)}#dock .chip{box-shadow:var(--sh)}
.clk.warn{color:#e6a100}.clk.over{color:#e03131}
.clk.end{color:color-mix(in srgb,var(--ac) 70%,var(--tx))}
.tools{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.tl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);text-decoration:none;font-weight:600;font-size:13px;transition:.15s}
.tl:hover{border-color:var(--ac);transform:translateX(3px)}
.tl span{font-size:16px}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* Modal Popup for NPS Boosters & Activity Reminders */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10005;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn .2s ease;
}
.modal-box {
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 20px;
  max-width: 600px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--sh);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* Draggable tool windows */
.tool-win{position:fixed;z-index:10002;width:420px;max-width:calc(100vw - 16px);max-height:85vh;display:flex;flex-direction:column;background:var(--card2);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.tool-win .tw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:move;user-select:none;touch-action:none;border-radius:16px 16px 0 0}
.tool-win .tw-title{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.tool-win .tw-x{padding:4px 12px;font-weight:bold;font-size:16px;cursor:pointer}
.tool-win .tw-body{padding:12px;overflow:auto}
#wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;user-select:none;width:min(78vw,520px);opacity:.1}
#wm svg{display:block;width:100%;height:auto}
#wm .sq{fill:#1a2a6c}
#wm .tx{fill:var(--tx)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #wm{opacity:.14}
  :root:not([data-theme="light"]) #wm .sq{fill:#5b74e8}
}
:root[data-theme="dark"] #wm{opacity:.14}
:root[data-theme="dark"] #wm .sq{fill:#5b74e8}

/* Central role switch */
#roleSwitch{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10006;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:14px;background:var(--card2);color:var(--tx);padding:9px 16px;font:inherit;font-weight:800;box-shadow:var(--sh);cursor:pointer;white-space:nowrap}
#roleSwitch.admin{background:linear-gradient(135deg,#0b8a55,#087f8c);color:#fff;border-color:transparent}
.hero{padding-top:22px}
@media(max-width:600px){#roleSwitch{top:8px;padding:7px 11px;font-size:12px}.hero{margin-top:48px}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<button id="roleSwitch" type="button" aria-label="Switch between agent and admin view">Agent View · Admin Console</button>
<div id="wm" aria-hidden="true">
<svg viewBox="0 0 400 130" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect class="sq" x="8" y="10" width="110" height="110" rx="26"/>
  <circle cx="63" cy="65" r="31" fill="#ffc72c"/>
  <path d="M36 70 L92 40 L72 94 L62 74 Z" fill="#fff"/>
  <path d="M62 74 L92 40" stroke="#1a2a6c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text class="tx" x="138" y="70" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Expedia</text>
  <text class="tx" x="141" y="108" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="3">Group</text>
</svg>
</div>

<!-- Left Floating Sidebar Toggle -->
<button id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Toggle Navigation Tools Sidebar">
  <span>☰</span> Tools
</button>

<!-- Persistent Embedded Tools Sidebar -->
<aside id="leftSidebar" class="left-sidebar">
  <div class="sidebar-title">Quick Tools</div>
  <nav class="sidebar-tools-list" id="sidebarToolsList"></nav>
</aside>

<div class="w">
<header class="hero">
  <div class="brand">
    <div class="logo-expedia" style="font-size:26px; font-weight:800; color:#ffc72c; letter-spacing:-1px; font-family:Inter,system-ui,sans-serif;">Expedia</div>
    <div>
      <h1>Performance Booster</h1>
      <p class="sub">Quick reference for processes, policies and OKC compensation</p>
    </div>
  </div>
  <div class="ctl">
    <div id="dots"></div>
    <button id="scn" class="ic" aria-label="Change background"></button>
    <button id="mode" class="ic" aria-label="Switch light or dark mode"></button>
  </div>
</header>

<div class="srch">
  <span>🔍</span>
  <input id="q" type="search" placeholder="Search all processes…" autocomplete="off">
</div>

<div id="main"></div>
<div class="ft">Performance Booster · for internal use</div>
</div>

<!-- Modal Container for Reminders -->
<div id="modalContainer"></div>
<div id="toolWindows"></div>
<div id="dock"></div>

ain to the customer that it's a pending charge that will drop soon within 24 hours maximum"}, {"path": ["Non Refundable", "Pay later", "Change"], "text": "Contact the hotel for an exception to Change  the booking free of charge and if the hotel approved you can go ahead and Change and remmber to not promise a refund as the customer wasn't charged already and if charged or pending charge you can explain to the customer that it's a pending charge that will drop soon within 24 hours maximum and if didn't approve to cancel we can check for approval to change the booking so we can offer it as alternative to the customer"}, {"path": ["Non Refundable", "Pay later", "Complaint"], "text": "• Transfer to Relocation / Tier 3 Team if:\n  - Health and safety issue\n  - Hotel cancelled the booking on customer\n  - Hotel is not able to accommodate the customer\n\n• Otherwise: Check the reasons in the calculator and proceed with the OKC accordingly."}, {"path": ["Non Refundable", "payment on schedules", "Cancel"], "text": "Contact the hotel for an exception to cancel the booking free of charge and if the hotel approved you can go ahead and cancel and remmber to not promise a refund as the customer wasn't charged  and if charged Explain that it will be refunded by the hotel and if not charged you can explain that the charge will drop within 24 hours as it wasn't charged"}, {"path": ["Non Refundable", "payment on schedules", "Change"], "text": "As the payment on schedules booking can not be changed so we can offer to rebook or cancel so in that case we should seek an exception for the cancellation so the customer can rebook and we should call the hotel to seek an exception for that booking to cancel it free of charge and remmber to not promise a refund as the customer wasn't charged  and if charged Explain that it will be refunded by the hotel and if not charged you can explain that the charge will drop within 24 hours as it wasn't charged"}, {"path": ["Non Refundable", "payment on schedules", "Complaint"], "text": "• Transfer to Relocation / Tier 3 Team if:\n  - Health and safety issue\n  - Hotel cancelled the booking on customer\n  - Hotel is not able to accommodate the customer\n\n• Otherwise: Check the reasons in the calculator and proceed with the OKC accordingly."}]}, {"name": "NPS Boosters", "levels": ["Policy"], "entries": [{"path": ["Trust the traveler"], "text": "**Trust the traveler doesn’t apply to:**\n• Pay Later/Hotel Collect bookings where Expedia isn’t the merchant of record\n• 3PI bookings\n• Non-lodging parts of a package\n\n**Otherwise:**\n• If the customer claims he got an approval on the hotel booking verbally, we ask about the approval’s name and job title.\n• If the approval was by email, we ask for a screenshot.\n• If that was provided, we can proceed with the process without penalty."}, {"path": ["OneKeyCash refund option"], "text": "**OneKeyCash refund option for lodging (RWA# 6089)**\nFor eligible cancellations, always offer the traveler the choice between:\n• A refund to their original payment method, which takes up to 10 days\n• OneKeyCash, which they can use immediately to book again without waiting for the refund\n\nPlease check eligibility first (POS, payment type, Expedia Collect) and don’t mention OKC on ineligible bookings."}, {"path": ["Hotels.com US: Cancel for any reason"], "text": "**Hotels.com US: Cancel for any reason bookings (RWA# 5977)**\n• Non-refundable bookings with Cancel for any reason get a full card refund with no supplier approval, as long as they’re cancelled in OneDesk before 8:00 a.m. local property time on the check-in day.\n• After that time, standard non-refundable rules apply.\n• Date or room changes aren’t allowed. The traveler must cancel and rebook."}]}, {"name": "Cars", "levels": ["refundability", "Payment type", "Intent"], "entries": [{"path": ["Refundable", "Pay now Merchant", "Cancel"], "text": "Proceed with the cancellation if the customer is still active in chat with you and requested it"}, {"path": ["Refundable", "Pay now Merchant", "Change"], "text": "No changes on car bookings we should advise to cancel and rebook and you can search for alternatives on BSA"}, {"path": ["Refundable", "Pay now Merchant", "Billing"], "text": "If customer claims extra charges we should first ask for the reciept for that payments and we validate from voyager or BSA if that amount was mentioned in rules and regulations if yes we explain it if not we refund it to the customer as expedia loss payout after validating with superviosr"}, {"path": ["Refundable", "Pay now Merchant", "Car unavailable at pickup"], "text": "Contact the car rental counter to confirm the vehicle is unavailable.\nIf the vendor confirmed car was not available :\n\nCancel the original booking and process a full refund using the Credit workflow.\nAssist with rebooking and request post-trip receipts to refund any price difference.\n\nIf the vendor Was not reachable :\nExplain to the customer that we wasn’t able to reach the vendor and assign SR to reach the vendor and confirm it \n\nNotes:* Remmber if the amount Above  500 or more we assign SR for that refund \n•\tAlso the new booking hould be using the same payment type for the cancelled one"}, {"path": ["Refundable", "Pay Now agency", "Cancel"], "text": "Proceed with the cancellation if the customer is still active in chat with you and requested it"}, {"path": ["Refundable", "Pay Now agency", "Change"], "text": "No changes on car bookings we should advise to cancel and rebook and you can search for alternatives on BSA"}, {"path": ["Refundable", "Pay Now agency", "Billing"], "text": "If customer claims extra charges we should first ask for the reciept for that payments and we validate from voyager or BSA if that amount was mentioned in rules and regulations if yes we explain it if not we refund it to the customer as expedia loss payout after validating with superviosr"}, {"path": ["Refundable", "Pay Now agency", "Car unavailable at pickup"], "text": "Contact the car rental counter to confirm the vehicle is unavailable.\n\nIf the vendor confirmed the car was not available:\nCancel the original booking and let the vendor process the refund directly (do not process it yourself, as we are not the merchant of record).\nAssist with rebooking and request post-trip receipts to refund any price difference.\n\nIf the vendor was not reachable:\nExplain to the customer that we weren't able to reach the vendor today, and we will follow up with the rental company later to request refund approval.\n\nNotes:\nthe new booking should be using the same payment type as the cancelled one .                                                                .Enter case notes:\nFirst line: Name of the car company agent (first name and last name initial) who confirmed the issue, location of the car company agent.\nIf approved by centralized team, enter: Approved by centralized team at [location]\nSecond line: New booking conf number, name of new rental company, new booking amount, price difference covered by EG.\nExample:\nConfirmed no car availability with Timothy W from San Diego.\nAlternate booking: BC34567 with Hertz at $250, EG covered amount $150."}, {"path": ["Refundable", "Pay later", "Cancel"], "text": "Proceed with the cancellation if the customer is still active in chat with you and requested it"}, {"path": ["Refundable", "Pay later", "Change"], "text": "No changes on car bookings we should advise to cancel and rebook and you can search for alternatives on BSA"}, {"path": ["Refundable", "Pay later", "Billing"], "text": "If customer claims extra charges we should first ask for the reciept for that payments and we validate from voyager or BSA if that amount was mentioned in rules and regulations if yes we explain it if not we refund it to the customer as expedia loss payout after validating with superviosr"}, {"path": ["Refundable", "Pay later", "Car unavailable at pickup"], "text": "Contact the car rental counter to confirm the vehicle is unavailable.\n\nIf the vendor confirmed the car was not available:\nCancel the original booking (no initial refund is required since the traveler has not yet paid).\nAssist with rebooking and request post-trip receipts to refund any price difference.\n\nIf the vendor was not reachable:\nExplain to the customer that we weren't able to reach the car rental company.\nCancel the original booking.\n\nNotes:\n\nRemember if the price difference refund is $500 or more, we assign an SR for that refund.\n\nAlso, the new booking should be using the same payment type as the cancelled one."}, {"path": ["Non Refundable", "Pay now Merchant", "Cancel"], "text": "If the reason is Anything except:car unavailable, incorrect car type, missing reservation, poor car condition, location unexpectedly closed, or insurance issues, and the rental is covered by Article #000004490, we can cancel free of charge to the customer Only if the car venor is one of the listed in that article below.\nArticle #000004490: https://traveler.my.site.com/Runway/s/article/Car-Cancel-Waiver-policy?language=en_US            Note: If one of the reassons above is the customer's reasson we seek a wiaver from the car agency by calling them to seek an exception"}, {"path": ["Non Refundable", "Pay now Merchant", "Change"], "text": "No changes on car bookings we should advise to cancel and rebook and you can search for alternatives on BSA"}, {"path": ["Non Refundable", "Pay now Merchant", "Billing"], "text": "If customer claims extra charges we should first ask for the reciept for that payments and we validate from voyager or BSA if that amount was mentioned in rules and regulations if yes we explain it if not we refund it to the customer as expedia loss payout after validating with superviosr"}, {"path": ["Non Refundable", "Pay now Merchant", "Car unavailable at pickup"], "text": "Contact the car rental counter to confirm the vehicle is unavailable.\nIf the vendor confirmed car was not available :\n\nCancel the original booking and process a full refund using the Credit workflow.\nAssist with rebooking and request post-trip receipts to refund any price difference.\n\nIf the vendor Was not reachable :\nExplain to the customer that we wasn’t able to reach the vendor and assign SR to reach the vendor and confirm it \n\nNotes:* Remmber if the amount Above  500 or more we assign SR for that refund \n•\tAlso the new booking hould be using the same payment type for the cancelled one"}, {"path": ["Non Refundable", "Pay Now agency", "Cancel"], "text": "You can seek a waiver for supplier-driven issues or when the rental company employee refused a refund.\nContact the rental company and request a free cancellation + waiver of any penalty fees. If approved, document the employee’s name/title.\nDo NOT process the refund yourself. The supplier must issue the refund directly because we are not the merchant of record."}, {"path": ["Non Refundable", "Pay Now agency", "Change"], "text": "No changes on car bookings we should advise to cancel and rebook and you can search for alternatives on BSA"}, {"path": ["Non Refundable", "Pay Now agency", "Billing"], "text": "If customer claims extra charges we should first ask for the reciept for that payments and we validate from voyager or BSA if that amount was mentioned in rules and regulations if yes we explain it if not we refund it to the customer as expedia loss payout after validating with superviosr"}, {"path": ["Non Refundable", "Pay Now agency", "Car unavailable at pickup"], "text": "Contact the car rental counter to confirm the vehicle is unavailable.\n\nIf the vendor confirmed the car was not available:\nCancel the original booking and let the vendor process the refund directly (do not process it yourself, as we are not the merchant of record).\nAssist with rebooking and request post-trip receipts to refund any price difference.\n\nIf the vendor was not reachable:\nExplain to the customer that we weren't able to reach the vendor today, and we will follow up with the rental company later to request refund approval.\n\nNotes:\nthe new booking should be using the same payment type as the cancelled one .                                                                .Enter case notes:\nFirst line: Name of the car company agent (first name and last name initial) who confirmed the issue, location of the car company agent.\nIf approved by centralized team, enter: Approved by centralized team at [location]\nSecond line: New booking conf number, name of new rental company, new booking amount, price difference covered by EG.\nExample:\nConfirmed no car availability with Timothy W from San Diego.\nAlternate booking: BC34567 with Hertz at $250, EG covered amount $150."}, {"path": ["Non Refundable", "Pay later", "Cancel"], "text": "You can seek a waiver only if a credit card is attached and a penalty fee applies if not attached then it's risk free booking and customer will not be charged:\nContact the rental company and request a free cancellation + waiver of any penalty fees for supplier-driven issues or if the supplier refused a refund.\nIf approved, follow the Cancel and refund with waiver process. If there is no credit card attached, do not seek a waiver for a pre-trip cancellation."}, {"path": ["Non Refundable", "Pay later", "Change"], "text": "No changes on car bookings we should advise to cancel and rebook and you can search for alternatives on BSA"}, {"path": ["Non Refundable", "Pay later", "Billing"], "text": "If customer claims extra charges we should first ask for the reciept for that payments and we validate from voyager or BSA if that amount was mentioned in rules and regulations if yes we explain it if not we refund it to the customer as expedia loss payout after validating with superviosr"}, {"path": ["Non Refundable", "Pay later", "Car unavailable at pickup"], "text": "Contact the car rental counter to confirm the vehicle is unavailable.\n\nIf the vendor confirmed the car was not available:\nCancel the original booking (no initial refund is required since the traveler has not yet paid).\nAssist with rebooking and request post-trip receipts to refund any price difference.\n\nIf the vendor was not reachable:\nExplain to the customer that we weren't able to reach the car rental company.\nCancel the original booking.\n\nNotes:\n\nRemember if the price difference refund is $500 or more, we assign an SR for that refund.\n\nAlso, the new booking should be using the same payment type as the cancelled one."}]}, {"name": "Insurance", "levels": ["refundability", "Product", "Intent"], "entries": [{"path": ["Cancel button is working", "Hotel", "Cancel"], "text": "Proceed with the cancellation as it will be free of charge if the button is working"}, {"path": ["Cancel button is working", "Car", "Cancel"], "text": "Proceed with the cancellation as it will be free of charge if the button is working"}, {"path": ["Cancel button is working", "package", "Cancel"], "text": "Proceed with the cancellation as it will be free of charge if the button is working"}, {"path": ["Cancel button is not working", "Hotel", "Cancel"], "text": "For cancelling the insurance on a hotel booking we can only cancel in the following secnarios:\n\n\n\nWithin 15 days of purchase — if the trip hasn’t started and the traveler hasn’t filed a claim. \n\nVoided booking — if the original hotel booking was canceled within the 15-day cool-off period but the insurance was left active. \n\nSame-day hotel booking canceled — if the traveler cancels the same-day hotel booking was made , the travel protection can be refunded. \n\nHotel date change — if a new itinerary number is required and the change is within the 15-day window, cancel and refund the existing insurance. \n\n\n\nImportant: For a non-refundable hotel, do not cancel the insurance just because the hotel is non-refundable. The traveler should keep the insurance and contact the insurance provider to file a claim."}, {"path": ["Cancel button is not working", "Car", "Cancel"], "text": "We can process the refun for the insurance only in following secnarios :                                                                           Pre-trip cancellation — Traveler wants to cancel the car and/or insurance, as long as they haven’t picked up the car.\nChange of booking dates — Cancel the existing booking and rebook; the traveler can add insurance to the new booking.\nEG insurance not honored — The rental company refuses to accept the insurance or tells the traveler to buy different insurance.\nTraveler was charged extra for insurance — Document the issue and refund your insurance.\nNo-show / car not picked up — If the traveler never picked up the car, the insurance can be refunded. This applies up to 24 hours post-trip.\nCar canceled by the supplier — If the supplier cancels because of issues such as car unavailable, wrong car type, price mismatch, location closed, duplicate booking, or pickup timing issues, refund the insurance.\n\nImportant: If the traveler has already picked up the car, the insurance generally should not be refunded, except where the specific policy/process says otherwise."}, {"path": ["Cancel button is not working", "package", "Cancel"], "text": "Within 15 days of purchase — trip hasn’t started and no claim has been filed.\nVoided booking — the original package was canceled within the 15-day cool-off period, but the insurance was not canceled.\nDestination change — the original insurance is not valid for the new destination.\nPackage date change requiring a new itinerary number — the original protection does not cover the new booking."}]}, {"name": "Activity", "levels": ["refundability", "Intent"], "entries": [{"path": ["Direct supplier", "Cancel"], "text": "**Direct Supplier (EG Native) – Cancellation/Refund Process**\n\n1. **Supplier-driven issue:** No waiver approval is needed. Trust the customer and proceed with the refund.\n2. **Refund under $500:** Use the **Credit workflow** and file **Breakage**.\n3. **Refund over $500:** Create a **Refund Over $500 SR**.\n4. **Document the exact supplier-driven reason** in **Voyager Classic → Credit Notes** (e.g., supplier canceled, booking not confirmed, supplier denied service, overbooked, voucher/ticket not honored).\n5. **Do NOT call/email the supplier** or create a waiver SR for a supplier-driven Direct Supplier issue.\n\n**IMPORTANT – Round-trip Shuttle Services:**\nRound-trip Shuttle Services (e.g., **Airport → Hotel → Airport** or vice versa) are **excluded from auto approval**. Follow the regular process by **contacting the supplier to obtain a partial refund**.\n**If a full refund is processed on a round-trip shuttle, this will be considered an AGENT ERROR.**                                        If NOT supplier-driven:\n\nRefundable / within cancellation policy: Cancel normally in BSA → customer receives the applicable refund.\nNon-refundable / cancellation deadline passed: Reinforce the non-refundable policy. Do not call/email the supplier for a waiver and do not create a VNA case.\nChanges: Activity changes are not allowed → cancel and rebook using BSA."}, {"path": ["Direct supplier", "Change"], "text": "Activity changes are NOT allowed.\nCancel the current activity and rebook a new one using BSA.\nDo not call the supplier or send an email to request a change."}, {"path": ["Direct supplier", "Activity closed"], "text": "If you mean the activity is closed / partner is closed for a Direct Supplier, the process is:\n\nWithin the cancellation policy: Cancel the booking and email Activities Help for investigation.\nOutside the cancellation policy: Attempt to contact the supplier for refund approval and check the activity status.\nIf the supplier does not respond: Create a Refund Over $500 SR and email Activities Help.\nIf the supplier confirms the closure: Follow the refund action based on their response"}, {"path": ["Third party", "Cancel"], "text": "For Third-Party Supplier – Frontline (Viator / GYG)Article number1333:\n\nCancel – Refundable\nUse the Cancel button.\nIf Cancel is greyed out but the customer qualifies for a refund → process the Credit.\nReason: Site error / Agent Tool Refund Error\nNotify the appropriate 3P partner manually to accept the cancellation.\nYou can offer to book another activity.\nCancel – Non-refundable\nDo NOT call the activity provider.\nSend an email to the appropriate 3P partner to request cancellation/refund approval.\n3P email approval is required, even if the activity provider says they approved it.\n\nQuick rule:\nRefundable → Cancel/credit.\nNon-refundable → Email the 3P partner; don't call."}, {"path": ["Third party", "Change"], "text": "Activity changes are NOT allowed.\nCancel the current activity and rebook a new one using BSA.\nDo not call the supplier or send an email to request a change."}, {"path": ["Third party", "Activity closed"], "text": "For Third-Party Supplier – Frontline (Viator / GYG) when the activity is closed:\n\nDo NOT call the supplier.\nIdentify the 3P provider from the supplier reference:\nBR → Viator\nGYG → GetYourGuide\nSend an email to the appropriate 3P partner to request refund approval. Never email both providers.\nTell the customer that we need to email the activity provider to seek approval.\n\nQuick rule:\nActivity closed + 3P → Email the correct 3P partner, don’t call.\n3P email approval is required before processing the refund."}, {"path": ["Special agreement", "Cancel"], "text": "For a Special Agreement activity cancellation, the frontline process is:\n\nDo not contact the activity provider directly.\n\nTell the customer the activity is non-refundable and that you’ll submit a cancellation/refund request by email.\n\nFrom Voyager Next, email activitieshelp@expediagroup.com using the “Cancel and refund special agreement activity” template.\n\nTell the customer they should receive an email response within 5 days.\n\nPartner Support should generally only be contacted for extenuating circumstances, such as a flex policy, force majeure, hospitalization, death of a family member/friend, or Gold status.\n\nException: Disneyland California: bookings made before July 10, 2025 may still have a cancellation entitlement; send the request to the Activities Help Desk for processing."}, {"path": ["Special agreement", "Change"], "text": "Activity changes are NOT allowed.\nCancel the current activity and rebook a new one using BSA.\nDo not call the supplier or send an email to request a change."}, {"path": ["Special agreement", "Activity closed"], "text": "If the Special Agreement activity provider is permanently closed:\n\nTell the customer you’ll submit the refund request by email.\n\nEmail activitieshelp@expediagroup.com using the “Cancel and refund special agreement activity” template.\n\nTell the customer they should receive a response within 5 days.\n\nDo not contact the special-agreement supplier directly."}]}, {"name": "Loyalty(Onekeycash+Gift cards)", "levels": ["Intent"], "entries": [{"path": ["Earn and benfits"], "text": "Trip Elements\nCountable travel components: flights, hotel/car/vacation-rental/cruise nights, transfers, and activities.\n\nEach qualifying component counts as a trip element; qualification depends on the POSa minimum spend.\n\nOneKeyCash-redemption portions can still earn trip elements if the booking meets the threshold.\n\nTier Status\nTrip elements earned Jan 1–Dec 31 determine the next year's tier.\n\nBlue: 0 | Silver: 5 | Gold: 15 | Platinum: 30 trip elements.\n\nReaching a new tier early gives immediate status through the following full year.\n\nEarn Rates\nBase US POSa earn rates: Blue 1%, Silver/Gold 2%, Platinum 3% on eligible spend.\n\nVIP Access rates: Silver 3%, Gold 4%, Platinum 6%.\n\nRates can vary by POSa and brand; taxes/fees are excluded.\n\nTier Benefits\nHigher tiers provide increased Member Prices, VIP Access benefits, and higher OneKeyCash earnings.\n\nBenefits can include room upgrades, food/beverage perks, Price Tracking, and Price Drop Protection.\n\nGold/Platinum also receive priority support; Platinum has VIP Support.\n\nEarn Confirmation Timelines\nActivities, packages, Pay Now hotels/cars: up to 3 days after completion.\n\nFlights: up to 10 days; Pay Later hotel/Vrbo: up to 35 days.\n\nCruises: up to 45 days; Pay Later car: up to 90 days.\n\nIneligible for Rewards\nExamples: bookings before joining One Key, guest bookings, taxes/fees, insurance, coupons, gift cards, group rates, and direct airline bookings.\n\nUS POSa flight bookings are currently ineligible.\n\nTAAP agent-account bookings don't earn rewards, but personal One Key accounts can.\n\nMissing OneKeyCash or Trip Elements\nFirst verify that the booking is eligible and the confirmation timeframe has passed.\n\nIf eligible rewards are missing, manually adjust OneKeyCash/trip elements.\n\nUse the applicable Loyalty | One Key | Adjust OneKeyCash and trip elements process.\n\nVIP Access Earnings\nVIP Access properties provide higher OneKeyCash rates for Silver, Gold, and Platinum.\n\nSilver 3% | Gold 4% | Platinum 6% for the US POSa.\n\nRates may differ by POSa/brand.\n\nMobile App Bookings\nThere is no additional OneKeyCash just for booking through the mobile app.\n\nPrevious Expedia Rewards mobile promotions don't apply to One Key.\n\nFuture promotional offers may provide additional rewards.\n\nRedemption Bookings\nTravelers can earn trip elements on redemption bookings.\n\nThe booking portion must meet the applicable POSa qualification amount.\n\nOneKeyCash used for payment does not itself earn OneKeyCash.\n\nTAAP Agents\nTAAP agents do not earn One Key rewards on their agent account.\n\nThey may have a separate personal One Key account.\n\nPersonal accounts must only be used for personal travel.\n\nRounding Differences\nOneKeyCash shown during booking may differ slightly from the confirmation email.\n\nThis can happen because of local-currency conversion and rounding.\n\nThe confirmation email/Rewards Activity amount is the final amount.\n\nTier Status Not Updated\nCheck whether the completed booking qualifies and whether its confirmation period has passed.\n\nIf eligible but the tier hasn't updated, manually adjust the rewards/trip elements.\n\nFollow Loyalty | One Key | Adjust OneKeyCash and trip elements.\n\nNon-One Key POSa\nOne Key is only available in participating brands/regions.\n\nIf the traveler moves to a non-One Key POSa, the applicable legacy rewards program may apply.\n\nExample: Expedia Rewards or Hotels.com Rewards, depending on the brand/POSa.\n\nHotels.com Rewards\nIn regions where One Key replaced Hotels.com Rewards, travelers can't continue earning stamps/reward nights.\n\nExisting stamps/reward nights were converted to OneKeyCash.\n\nOne Key allows rewards across participating Expedia brands and multiple travel products.\n\nOneKeyCash Expiration\nEarned OneKeyCash generally doesn't expire if the traveler makes an eligible booking or redemption at least once every 18 months.\n\nPromotional OneKeyCash may have a shorter expiration period.\n\nAlways check the specific promotion terms.\n\nCurrency Conversion\nOneKeyCash can display in the local POSa currency when booking internationally.\n\nThe balance is converted using the exchange rate applicable on the booking date.\n\nRewards Activity shows the current balance and transaction details in account/local currencies.\n\nChanged Account Currency\nIf the traveler says their One Key account currency changed automatically, follow the Loyalty | One Key | Join and manage account process.\n\nCheck the “Good to Know” section for currency-management information.\n\nDon't assume the displayed local currency means their actual rewards balance changed."}, {"path": ["Calculate of onekey cash earned"], "text": "Policy / POSa\nCalculations shown apply to US and UK POSa; rates can vary by brand and POSa.\n\nBase price excludes taxes, fees, OneKeyCash, and coupons.\n\nCruises are eligible only on US and Canada POSa.\n\nHotels, Expedia Vacation Rentals, Activities, Cars & Cruises\nBlue 1% | Silver/Gold 2% | Platinum 3%.\n\nExample: $150 base price → Blue $1.50, Silver/Gold $3, Platinum $4.50.\n\nTrip elements are earned separately when the booking qualifies.\n\nVrbo Vacation Rentals\nBlue 0% | Silver 1% | Gold/Platinum 2%.\n\nExample: $150 base price → Silver $1.50, Gold/Platinum $3.\n\nBlue members don't earn OneKeyCash on these bookings.\n\nVIP Access Properties\nBlue 2% | Silver 3% | Gold 4% | Platinum 6%.\n\nExample: $150 base price → $3 / $4.50 / $6 / $9 respectively.\n\nThese higher rates apply specifically to VIP Access properties.\n\nCalculation Formula\nOneKeyCash = Base price × applicable earn rate.\n\nExample: $150 × 4% = $6 OneKeyCash.\n\nExclude taxes, fees, OneKeyCash, and coupon-paid amounts.\n\nExample: 3-Night VIP Access Hotel\n$150 total base price earns 3 trip elements because each night counts separately.\n\nOneKeyCash: Blue $3 | Silver $4.50 | Gold $6 | Platinum $9.\n\nTrip elements and OneKeyCash are calculated independently."}, {"path": ["Onekeycash redemption process"], "text": "Redeem OneKeyCash Online\nTravelers can redeem OneKeyCash themselves during checkout on participating brands.\n\nOn the payment screen, eligible bookings will show the option to apply OneKeyCash.\n\nEncourage self-service through the website or mobile app.\n\nRedeem Through an Agent\nLodging: Book in Voyager Classic, deduct the requested OneKeyCash in Voyager Next, then refund the equivalent amount in Voyager Classic.\n\nNon-lodging: Use BSA to book and apply OneKeyCash.\n\nUse the One Key adjustment process if help is needed.\n\nAutomatic OneKeyCash Redemption\nExpedia & Vrbo: OneKeyCash is automatically applied; traveler must turn it off if unwanted.\n\nHotels.com: OneKeyCash is not automatic; traveler must turn it on.\n\nExpedia: Traveler can adjust how much OneKeyCash to redeem.\n\nChanges to Redemption Bookings\nPenalty-free change to a cheaper booking → OneKeyCash is automatically refunded.\n\nMore expensive change → original OneKeyCash carries over; card pays the difference.\n\nAdditional OneKeyCash cannot cover the difference; cancel/rebook if needed.\n\nRefunds\nUsing the Refund button → OneKeyCash is automatically returned.\n\nOneKeyCash refunds/adjustments may take up to 72 hours to appear in Rewards Activity.\n\nCredit Button\nUsing Credit does not automatically return OneKeyCash.\n\nManually return the OneKeyCash using the One Key adjustment process.\n\nCancellations\nPenalty-free cancellation: OneKeyCash automatically returns.\n\nCancellation with penalty: OneKeyCash is not returned.\n\nIf the penalty is waived, OneKeyCash is automatically returned.\n\nPartial-Penalty Refund\nIf canceled within a penalty window, used OneKeyCash is not returned and no rewards are earned.\n\nIf the penalty is waived, OneKeyCash is automatically returned.\n\nForgot to Use OneKeyCash\nOneKeyCash cannot be added to an existing booking by changing the payment method.\n\nIf the booking is penalty-free, the traveler can cancel and rebook using OneKeyCash.\n\nRewards After Cancellation/Change\nCanceled portions don't earn rewards.\n\nOneKeyCash and trip elements are adjusted based on the final booking.\n\nTrip elements generally don't need manual adjustment for redemption-booking changes.\n\nOneKeyCash Adjustment Not Showing\nAdjustments are generally immediate but may take up to 24 hours to appear.\n\nCheck the Brand Site to confirm the adjustment was completed."}, {"path": ["Redmption rules"], "text": "General Redemption Rules\nBooking must be Pay Now and show the option to use OneKeyCash.\n\nOneKeyCash is not earned on the portion paid with OneKeyCash.\n\nIf OneKeyCash doesn't cover the full amount, the remaining balance must be paid by credit/debit card.\n\nHotels\nOneKeyCash can pay for Pay Now hotels + insurance.\n\nAvailability depends on the booking showing the redemption option.\n\nTaxes/fees may be covered depending on brand and POSa.\n\nVrbo\nOneKeyCash can pay for eligible Vrbo bookings.\n\nFor installment bookings, it can only be used toward the first payment.\n\nRedemption is not available on IPM bookings.\n\nCars\nOneKeyCash can pay for Pay Now standalone car rentals or Car + Insurance.\n\nThe booking must offer the OneKeyCash redemption option.\n\nRemaining balance must be paid by credit/debit card.\n\nActivities\nOneKeyCash can be used for Pay Now activities.\n\nThe booking must be eligible and display the redemption option.\n\nOneKeyCash isn't earned on the portion paid with OneKeyCash.\n\nPackages\nOneKeyCash can be used on select Pay Now packages.\n\nExpedia must be the Merchant of Record (MoR) for at least one component.\n\nMaximum redemption is limited to the value of the package components where Expedia is the MoR.\n\nTaxes & Fees\nOneKeyCash may cover taxes and fees for some brands/POSa.\n\nAlways check the POSa-specific policy.\n\nIf the redemption option isn't displayed, the booking isn't eligible.\n\nPayment Methods\nIf OneKeyCash doesn't cover the full booking, the remainder must be paid by credit/debit card.\n\nPayPal, Google Pay, Klarna, Cash App, Affirm, and Afterpay cannot be used for the remaining balance.\n\nPrice Drop Protection\nTravelers can use OneKeyCash to purchase Price Drop Protection when the flight redemption is eligible.\n\nEligibility depends on factors such as sufficient OneKeyCash and the airline.\n\nThis is separate from using OneKeyCash for the flight itself.\n\nOneKeyCash + Coupons\nExpedia: Promotional coupons and OneKeyCash can be used together.\n\nOneKeyCash is earned only on the amount paid by card and not covered by OneKeyCash/coupon.\n\nHotels.com and Vrbo: Promotional coupons and OneKeyCash cannot be combined."}, {"path": ["Legacy conversion"], "text": "One Key Migration\nOnly eligible activity from participating brands/POSa counts toward One Key tier status.\n\nFor Expedia POSa outside US/UK that joined in 2025, the higher of eligible 2024 activity vs. 2025 activity before joining determined the starting tier.\n\nIf no eligible activity exists, the traveler starts at Blue.\n\nMigration Tier Duration\nFor Expedia travelers who migrated in 2025, the assigned tier remains active through February 28, 2027.\n\nMatching email addresses are required when combining activity from multiple participating brands/POSa.\n\nPreviously manually awarded tier status is retained at minimum.\n\nExpedia Rewards Points Conversion\n100 Expedia Rewards points = $1 OneKeyCash with no loss of value.\n\nExample: 1,250 points = $12.50 OneKeyCash.\n\nThe original points expiration date is retained, subject to the migration rules.\n\nHotels.com Reward Nights\nApplies to US and UK.\n\nReward nights were converted to OneKeyCash at their full value.\n\nExample: a $125 reward night = $125 OneKeyCash.\n\nHotels.com Reward Stamps\nApplies to US and UK.\n\nEach stamp was converted at 10% of its value, because 10 stamps previously earned a reward night.\n\nExample: a $125 stamp = $12.50 OneKeyCash.\n\nHotels.com Expiration\nConverted stamps/reward nights retain their original expiration date.\n\nHotels.com Rewards generally expired 12 months after the last eligible activity.\n\nIf converted Expedia points had a later expiration date, the later date could apply.\n\nVrbo Migration\nVrbo had no previous loyalty program, so there were no legacy rewards to convert.\n\nTravelers began earning OneKeyCash on eligible bookings after joining One Key.\n\nThis applies across Vrbo and heritage-brand markets.\n\nPending Rewards During Migration\nUS/UK: Eligible bookings completed after joining One Key earn at One Key rates.\n\nOutside US/UK: Pre-One-Key bookings generally retain the legacy rate, even if completed after joining.\n\nChanges made after One Key launches can cause the booking to earn under the new One Key rate.\n\nTraveler Says Rewards Were Migrated Incorrectly\nCheck the traveler's Voyager Next loyalty section for converted OneKeyCash.\n\nIf a specific booking/reward is missing, follow the legacy rewards conversion error process.\n\nFor a full migration reconciliation, Tier 3 can email Rewards Support using the Rewards Migration Research template.\n\nGuest Bookings / Missing Legacy Rewards\nMigration only included rewards attached to the traveler's account.\n\nGuest-account bookings were not included automatically.\n\nFollow the Research legacy rewards conversion errors process for these cases.\n\nOne Key Not Available on Another POSa\nExpedia: Accounts are POSa-specific; rewards remain on a POSa until One Key launches there.\n\nHotels.com: Rewards accounts are global, but conversion depends on the account's Preferred POSa.\n\nTravelers can continue using the applicable legacy rewards program where One Key hasn't launched."}, {"path": ["Promotional onekeycash"], "text": "Travel-Earned OneKeyCash\nExpires after 18 months.\n\nPromotional OneKeyCash\nExpires on the date stated in the promotion.\n\nExpires at 11:59 PM PST.\n\nCheck Promotional Balance\nOneDesk: Traveler Account → Loyalty.\n\nVoyager Next: History → Loyalty.\n\nCheck Rewards Activity for specific promotion details.\n\nMissing Promotional Reward\nConfirm the promotion and whether it was claimed/gifted.\n\nIf confirmed missing, manually award the promotional OneKeyCash.\n\nExpired Promotional Reward\nConfirm “Expired Promotional OKC” in Loyalty History.\n\nYou may reinstate the same amount once as a gift.\n\nReason: Other; note: Reinstating Expired Promotional OneKeyCash.\n\nCancellation\nPromotional OneKeyCash is returned after cancellation.\n\nOriginal expiration date remains unchanged.\n\nUsing OneKeyCash\nThe system uses the balance expiring soonest first.\n\nPartial use does not extend the remaining balance's expiration.\n\nImportant\nPromotional OneKeyCash does not extend the 18-month expiration of travel-earned OneKeyCash."}, {"path": ["VIP Access"], "text": "VIP Access\nVIP Access = selected hotels with high quality and service standards.\n\nLook for the VIP1 icon on the website/Voyager.\n\nAgent Tools may not show VIP status.\n\nVIP Benefits\nSilver, Gold & Platinum can receive perks such as Wi-Fi and breakfast.\n\nGold & Platinum: room upgrades, early check-in, and late checkout when available.\n\nExact perks vary by hotel and are shown in the itinerary/confirmation.\n\nExclusive Gold/Platinum Perk\nIf the traveler doesn't receive the listed perk, apologize and provide the applicable compensation.\n\nOne Key POSa: compensation = OneKeyCash.\n\nNon-One Key POSa: compensation = coupon.\n\nReport Missing Perk\nEmail VIP_perk@expediagroup.com internally with itinerary, hotel, traveler, issue, and compensation provided.\n\nDo not give the email address to the traveler.\n\nRoom Upgrade\nUpgrade is subject to availability.\n\nBefore arrival: traveler can request it at check-in; agents can also contact the hotel.\n\nIf unavailable, ask whether a better-location room is available.\n\nVIP Cancellation\nIf a VIP booking is canceled, the traveler must rebook with Expedia Group to receive VIP perks again.\n\nVIP perks do not automatically transfer to a new booking."}, {"path": ["Trip elemnts adjusment"], "text": "Before Adjusting\nResearch first and confirm the booking is eligible.\n\nAdjust rewards only after travel is completed.\n\nDon't submit a second adjustment until you've checked Voyager Next, OneDesk, and BSA and refreshed.\n\nAdjustment Limits\nOver your tool limit → use the appropriate adjustment-limit email template.\n\nPremium/Tier 3 can make multiple transactions, but the total must not exceed $1,000.\n\nDon't transfer a case just because one transaction exceeds the limit.\n\nOneDesk Process\nLoyalty → Adjust loyalty → select case.\n\nChoose adjustment type, reward type, add/deduct, reason, amount, and notes.\n\nComplete the adjustment and refresh Loyalty History to verify.\n\nVoyager Next Process\nVirtual Agent → Manage Rewards → Adjust Rewards.\n\nChoose add/deduct, reason, amount, cause, and notes.\n\nComplete and refresh Loyalty History to verify.\n\nAccount-Level Adjustment\nUse when rewards need to be added directly to the traveler's account, such as:\n\nGuest booking with missing rewards.\n\nCanceled booking where rewards need to be issued.\n\nBooking missing from the carousel but found in Voyager Classic.\n\nRewards still missing after the confirmation period.\n\nEligible cruise rewards.\n\nBooking fully paid with OneKeyCash.\n\nTool error prevents issuing rewards to the booking.\n\nImportant\nAccount-level OneKeyCash adjustments must use the traveler's rewards account currency.\n\nAccount-level adjustments post immediately.\n\nBooking-level adjustments may remain pending until the earn confirmation timeframe."}, {"path": ["Gift cards"], "text": "Basic Rules\nAvailable in US, CA, UK, SE, AU; customers can use them online only, not by phone.\n\nValid for Pay Now hotel bookings only; not packages or car rentals. No gift-card usage fees.\n\nCan combine with another payment method and eligible bookings can earn Hotels.com Rewards.\n\nGift cards can be transferred to another customer and used immediately; no need to notify us.\n\nCannot be reloaded, replaced if lost/stolen/damaged, or returned.\n\nGift Card Values & Expiration\nUS/CA: $10–$2,000 USD/CAD; no expiration, but deactivate after 3 years while retaining the full value.\n\nUK: £10–£1,350; expires 3 years after activation.\n\nSE: 90–14,500 SEK; expires 3 years after activation.\n\nAU: $10–$2,500 AUD; expires 3 years after activation.\n\nUp to 5 cards can be merged for US, CA, UK, SE; AU cannot be merged.\n\nBalance / Merge\nCustomers can check balances or request eligible card merges through the Hotels.com gift-card service.\n\nGift cards can come from Hotels.com websites, B2B distributors, rewards/incentive programs, banks, and retail stores.\n\nE-gift cards are generally delivered within 1 hour; US/CA physical cards generally take 7–10 days.\n\nHow Customers Redeem\nWebsite/app → choose an eligible Pay Now hotel → select Gift Card as payment → enter card number + PIN.\n\nWebsite search can use the Pay with Hotels.com gift card filter.\n\nPay Later bookings do not offer gift-card payment.\n\nIf the Gift Card option is unavailable, customer must select another hotel.\n\nAgents should encourage self-service; if needed, send an event-driven email with reservation details or guide the customer through the online process.\n\nChanging / Canceling a Gift-Card Booking\nRefund goes automatically to a new gift card.\n\nIf gift card + another payment method was used, the gift-card portion returns to a new gift card and the remaining refund goes to the other payment method.\n\nNew gift card is normally emailed within 4 hours.\n\nCustomer cannot rebook using the refunded amount until they receive the new gift-card email.\n\nWrong Customer Email\nVerify the email address.\n\nIf incorrect, email giftcards@hotels.com with:\n\nCustomer name\n\nEmail used for booking\n\nCorrect email\n\nItinerary number\n\nCancellation date\n\nOriginal gift-card number\n\nGift-card value/currency\n\nIssue description\n\nCustomer Didn't Receive New Gift Card\nCheck Voyager → Billing History.\n\nIf refund shows successful, follow the gift-card FAQ/support process.\n\nIf refund is pending/failed, do not refund the original card or another payment method.\n\nEmail giftcards@hotels.com with customer name/email, itinerary, cancellation date, original card number, value/currency, and issue description.\n\nFailed Gift-Card Refund\nNever attempt another payment-method refund.\n\nEmail giftcards@hotels.com with the complete case details.\n\nTell the traveler the request has been forwarded to the gift-card team and should be resolved within 72 hours.\n\nIf they ask to be transferred, explain the team is offline and unavailable for live assistance.\n\nCommon Gift-Card Issues\nCheckout error: Possible causes include incorrect card/PIN attempts or site issues. Customer can contact the gift-card team or the number on the back of the card.\n\nHotels.com/GiftCard purchase/resend/receipt: Contact the applicable gift-card support number and provide name, mailing address, phone, value/currency, last 4 digits of payment card, and issue.\n\nOther redemption/balance questions: Email giftcards@hotels.com with name, email, card number/value/currency, proof of purchase, and issue.\n\nLost/stolen card: If funds remain, place a fraud hold immediately using the applicable country number, then email the gift-card team with customer details, card photo/screenshot, purchase source, value/currency, receipt/email confirmation, and issue.\n\nGift-card investigations for lost/stolen cases generally take 24–48 hours.\n\nFraud / Scams / Theft\nTreat gift cards like cash; Hotels.com is generally not liable for lost/stolen cards.\n\nDo not promise cash refunds or replacement cards.\n\nGift-card team investigates card history and redemptions case by case.\n\nIf funds can be recovered, a replacement may be considered.\n\nDo not refund the original card or another payment method; send the case to giftcards@hotels.com.\n\nRewards\nEligible gift-card hotel bookings can still earn Hotels.com Rewards stamps.\n\nNormal booking eligibility requirements still apply.\n\nImportant Agent Contacts\nGift-card support: giftcards@hotels.com — external team; do not provide the email to travelers.\n\nVIP Access issues: VIP_perk@expediagroup.com — internal; do not provide to travelers.\n\nOneKey migration research: rewardssupport@expediagroup.com — internal; do not provide to travelers.\n\nKey Agent Rule\nResearch first → check Voyager/Billing History → collect all required details → use the correct escalation path → never promise a refund/replacement that the policy does not authorize."}]}], "issues": [{"cat": "Problem with room or hotel condition", "issue": "Bad smell in hotel or room", "pct": 0.1}, {"cat": "Problem with room or hotel condition", "issue": "Not enough bedding", "pct": 0.1}, {"cat": "Problem with room or hotel condition", "issue": "Cosmetic damage to building", "pct": 0.1}, {"cat": "Problem with room or hotel condition", "issue": "Mold on walls or windows", "pct": 0.1}, {"cat": "Problem with room or hotel condition", "issue": "Dirty room or hotel", "pct": 0.15}, {"cat": "Problem with room or hotel condition", "issue": "Bugs or other pests", "pct": 0.15}, {"cat": "Problem with room or hotel condition", "issue": "Broken glass on floor (small amount)", "pct": 0.15}, {"cat": "Problem with room or hotel condition", "issue": "Broken door locks", "pct": 0.15}, {"cat": "Problem with room or hotel condition", "issue": "No hot water in bath / shower", "pct": 0.15}, {"cat": "Problem with room or hotel condition", "issue": "No electricity", "pct": 0.15}, {"cat": "Problem with room or hotel condition", "issue": "Elevators don't work", "pct": 0.15}, {"cat": "Problem with hotel service or our service", "issue": "Construction in the area around hotel (not mentioned)", "pct": 0.1}, {"cat": "Problem with hotel service or our service", "issue": "Hotel staff is not helpful", "pct": 0.1}, {"cat": "Problem with hotel service or our service", "issue": "Agent was rude", "pct": 0.1}, {"cat": "Problem with hotel service or our service", "issue": "Construction at the hotel (not mentioned)", "pct": 0.15}, {"cat": "Problem with hotel service or our service", "issue": "Unexpected loud noise at night", "pct": 0.15}, {"cat": "Problem with hotel service or our service", "issue": "Hotel staff is rude", "pct": 0.15}, {"cat": "Problem with hotel service or our service", "issue": "Hotel staff enters guest's room without permission", "pct": 0.15}, {"cat": "Hotel/room not as advertised or booked", "issue": "No balcony as advertised", "pct": 0.1}, {"cat": "Hotel/room not as advertised or booked", "issue": "Smaller than advertised", "pct": 0.1}, {"cat": "Hotel/room not as advertised or booked", "issue": "One-star rating difference (3 stars instead of 4)", "pct": 0.1}, {"cat": "Hotel/room not as advertised or booked", "issue": "Guesthouse or B&B instead of hotel", "pct": 0.1}, {"cat": "Hotel/room not as advertised or booked", "issue": "Single room instead of double", "pct": 0.15}, {"cat": "Hotel/room not as advertised or booked", "issue": "No view as advertised", "pct": 0.15}, {"cat": "Hotel/room not as advertised or booked", "issue": "Confirmed request for adjoining rooms not met", "pct": 0.15}, {"cat": "Hotel/room not as advertised or booked", "issue": "Two-star rating difference (3 stars instead of 5)", "pct": 0.15}, {"cat": "Hotel/room not as advertised or booked", "issue": "Hostel instead of hotel", "pct": 0.15}, {"cat": "Hotel/room not as advertised or booked", "issue": "Not given an accessible room", "pct": 0.15}, {"cat": "Problems checking in", "issue": "No one at the front desk", "pct": 0.1}, {"cat": "Problems checking in", "issue": "Hotel can't find the reservation", "pct": 0.1}, {"cat": "Problems checking in", "issue": "Very long wait lines", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "TV doesn't work or only local channels", "pct": 0.05}, {"cat": "Problem with amenities", "issue": "Phone doesn't work", "pct": 0.05}, {"cat": "Problem with amenities", "issue": "Internet connection slow or not available", "pct": 0.05}, {"cat": "Problem with amenities", "issue": "Hotel activities/entertainment options not as advertised", "pct": 0.05}, {"cat": "Problem with amenities", "issue": "Food offerings not as advertised (other options available)", "pct": 0.05}, {"cat": "Problem with amenities", "issue": "No air conditioning in hotel common areas", "pct": 0.05}, {"cat": "Problem with amenities", "issue": "No private bathroom, or toilet / sink / shower as advertised", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "No additional beds, as requested or advertised", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "No swimming pool as advertised", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "No food as advertised, and no alternative options", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "No activities as advertised", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "No beach access or view as advertised", "pct": 0.1}, {"cat": "Problem with amenities", "issue": "No air conditioning in the room", "pct": 0.1}, {"cat": "Problem with payment", "issue": "Unauthorized charges from hotel", "pct": 0.05}, {"cat": "Problem with payment", "issue": "Unexpected pre-authorization charges", "pct": 0.05}, {"cat": "Premium/Elite Rewards", "issue": "Room upgrade / amenity / perk not provided as promised", "pct": 0.05}]}</script>

<script>
const D=JSON.parse(document.getElementById('d').textContent),P=D.products,R=document.documentElement,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const short=n=>n.replace(/\s*\(.*\)\s*$/,''),IC={hotel:'🏨','nps boosters':'⭐',cars:'🚗',insurance:'🛡️',activity:'🎟️',loyalty:'🎁'},icon=n=>IC[short(n).toLowerCase()]||'📋';
const AC=[['blue','#2f6bff','#5b5bf0'],['violet','#7048e8','#a23de0'],['emerald','#0b8a55','#0a8f8f'],['sunset','#d9480f','#e8590c'],['yellow','#e6a100','#f59f00']];
const ST={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const isDark=()=>R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;

const ctl=()=>{$('scn').textContent=SC[sc]?SC[sc][1]:'🚫';$('scn').title='Background: '+(SC[sc]?SC[sc][0]:'Off');$('mode').textContent=isDark()?'☀️':'🌙';document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.a===(R.dataset.a||'blue')))};

const W=1200,H=800,rg=s=>()=>(s=s*16807%2147483647)/2147483647;
const P1=(d,c,o)=>'<path class="'+c+'" opacity="'+o+'" d="'+d+'Z"/>';
const city=(s,b,lo,hi,c,o)=>{const r=rg(s);let x=-20,d='M-20 '+H;while(x<W+20){const w=40+r()*70,t=b-lo-r()*(hi-lo);d+='V'+t+'H'+(x+w)+'V'+H+'H'+(x+w+3);x+=w+3}return P1(d,c,o)};
const ridge=(s,b,a,c,o)=>{const r=rg(s);let d='M0 '+H+'V'+b,i=0;for(let x=0;x<=W+70;x+=70,i++)d+='L'+x+' '+(b-(i%2?r()*a*.35:a*(.4+.6*r())));return P1(d,c,o)};
const wave=(y,a,l,p,c,o)=>{let d='M0 '+H+'V'+y;for(let x=0;x<=W;x+=20)d+='L'+x+' '+(y+Math.sin(x/l+p)*a);return P1(d,c,o)};
const circ=(x,y,r,c,o)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="'+c+'" opacity="'+o+'"/>';
const stars=()=>{const r=rg(50021);let s='';for(let i=0;i<90;i++)s+=circ(r()*W|0,r()*480|0,(.8+r()*1.6).toFixed(1),'sc',(.15+r()*.45).toFixed(2));return s};
const balloon=(x,y,k,c,o)=>'<g transform="translate('+x+' '+y+') scale('+k+')"><g class="bl"><ellipse rx="32" ry="40" class="'+c+'" opacity="'+o+'"/><ellipse rx="11" ry="40" class="sc" opacity="'+o/3+'"/><path d="M-17 34L-9 58H9L17 34Z" class="'+c+'" opacity="'+o+'"/><rect x="-8" y="58" width="16" height="11" class="sc" opacity="'+o+'"/></g></g>';

const SC=[
['City','🏙️',()=>circ(930,250,70,'sb',.16)+city(70123,690,120,330,'sb',.15)+city(30457,760,60,230,'sa',.22)],
['Beach','🏖️',()=>circ(820,560,190,'sb',.10)+circ(820,560,120,'sb',.28)+wave(610,10,70,0,'sb',.16)+wave(670,14,90,1.5,'sa',.2)+wave(735,18,110,3,'sa',.28)],
['Mountains','🏔️',()=>circ(300,250,60,'sb',.2)+ridge(11033,540,300,'sb',.14)+ridge(50077,630,260,'sa',.2)+ridge(90019,720,200,'sa',.3)],
['Night sky','🌌',()=>stars()+'<mask id="mm"><rect width="1200" height="800" fill="#fff"/><circle cx="262" cy="170" r="42" fill="#000"/></mask><circle cx="240" cy="180" r="48" class="sb" opacity=".6" mask="url(#mm)"/>'+ridge(40013,720,150,'sa',.22)],
['Balloons','🎈',()=>balloon(220,300,1.7,'sb',.28)+balloon(560,200,1.1,'sa',.26)+balloon(900,360,2,'sa',.22)+balloon(1080,170,.9,'sb',.3)+balloon(400,520,.8,'sa',.2)+ridge(20011,740,110,'sa',.22)]
];

let sc=+ST.get('lhd-scene');if(!(sc>=0&&sc<=SC.length))sc=0;
const scene=()=>{$('scene').innerHTML=SC[sc]?'<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+SC[sc][2]()+'</svg>':''};

let tab=0,sel=[],q='';

const opts=(p,i)=>{const o=[];p.entries.forEach(e=>{if(sel.slice(0,i).every((v,k)=>e.path[k]===v)&&!o.includes(e.path[i]))o.push(e.path[i])});return o};
function fix(p){for(let i=0;i<p.levels.length;i++){const o=opts(p,i);if(!o.includes(sel[i])){sel.length=i;if(o.length==1)sel[i]=o[0]}if(sel[i]===undefined)break}}

/* Modal Popup Reminder Flows */
let npsIndex = 0;
function showNpsModalSequence(onComplete) {
  const npsProd = P.find(x => x.name === "NPS Boosters");
  if (!npsProd || !npsProd.entries.length) {
    onComplete();

const nowTZ=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}};

let WC24=ST.get('pb-wc24')==='1',wcIv=0;
const WCZ=(()=>{try{return Intl.supportedValuesOf('timeZone')}catch(e){return['UTC','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Europe/London','Europe/Paris','Africa/Cairo','Asia/Dubai','Asia/Kolkata','Asia/Manila','Asia/Tokyo','Australia/Sydney']}})().filter(z=>z!=='Etc/GMT+8');
const wcZone=z=>z==='auto'?nowTZ():z;
const wcLabel=z=>z==='Etc/GMT+8'?'PST (UTC−8)':z==='auto'?'📍 Auto-detect ('+nowTZ()+')':z.replace(/_/g,' ');
const wcAbbr=z=>{if(z==='Etc/GMT+8')return 'PST';try{return new Intl.DateTimeFormat('en-US',{timeZone:wcZone(z),timeZoneName:'short'}).formatToParts(new Date()).find(x=>x.type==='timeZoneName').value}catch(e){return ''}};
const wcSave=()=>ST.set('pb-wc',JSON.stringify(WC));
function wcHtml(){return '<div data-r="wcb"></div>'}
function wcTick(){const els=document.querySelectorAll('[data-wct]');if(!els.length){clearInterval(wcIv);wcIv=0;return}
 els.forEach(e=>{const z=WC[+e.dataset.wct];if(!z)return;const tz=wcZone(z),d=new Date();
  e.querySelector('[data-w="t"]').textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!WC24}).format(d);
  e.querySelector('[data-w="d"]').textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'short',day:'numeric'}).format(d)+' · '+wcAbbr(z)})}
function initWC(root){const box=root.querySelector('[data-r="wcb"]');
 const draw=()=>{const opts=z=>[['auto',wcLabel('auto')],['Etc/GMT+8',wcLabel('Etc/GMT+8')],...WCZ.map(x=>[x,wcLabel(x)])].map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===z?' selected':'')+'>'+esc(o[1])+'</option>').join('');
  box.innerHTML=WC.map((z,i)=>'<div class="card" data-wct="'+i+'"><div class="lbl">🕒 Clock '+(i+1)+(WC.length>1?'<button class="chip" data-wc="rm" data-i="'+i+'" style="margin-left:auto;padding:2px 10px" title="Remove" type="button">✕</button>':'')+'</div><div class="fld"><select data-wc="sel" data-i="'+i+'">'+opts(z)+'</select></div><div class="clk" data-w="t">--:--:--</div><div class="mu" data-w="d"></div></div>').join('')+'<div class="row">'+(WC.length<3?'<button class="chip on" data-wc="add" type="button">➕ Add clock ('+WC.length+'/3)</button>':'')+'<button class="chip" data-wc="fmt" type="button">'+(WC24?'🕐 Switch to 12-hour':'🕐 Switch to 24-hour')+'</button></div>';wcTick()};
 box.onchange=e=>{const s=e.target.closest('[data-wc="sel"]');if(s){WC[+s.dataset.i]=s.value;wcSave();wcTick()}};
 box.onclick=e=>{const b=e.target.closest('[data-wc]');if(!b)return;const k=b.dataset.wc;
  if(k==='add'&&WC.length<3){WC.push(WCD.find(z=>!WC.includes(z))||'auto')}
  else if(k==='rm'){WC.splice(+b.dataset.i,1)}
  else if(k==='fmt'){WC24=!WC24;ST.set('pb-wc24',WC24?'1':'0')}else return;
  wcSave();draw()};
 draw();if(!wcIv)wcIv=setInterval(wcTick,1000)}

/* ================= Flash cards (MCQ) ================= */
function fcAll(){const c=[];P.forEach(p=>p.entries.forEach(e=>c.push({t:'p',cat:short(p.name),q:p.levels.map((l,i)=>l+': '+e.path[i]).join('  ·  '),a:e.text})));
 D.issues.forEach(x=>c.push({t:'o',cat:'OKC %',q:x.issue,g:x.cat,pct:Math.round(x.pct*100)}));return c}
function fcHtml(){return '<div data-r="fc"></div>'}
function initFC(root){
 const box=root.querySelector('[data-r="fc"]'),all=fcAll(),cats=['All',...new Set(all.map(c=>c.cat))];
 let cat='All',len='10',g=null,best=+ST.get('pb-fcb')||0;
 const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
 const cl=t=>{t=t.replace(/\s+/g,' ').trim();return t.length>240?t.slice(0,237).trim()+'…':t};
 const build=c=>{const k={...c};
  if(c.t==='o'){k.o=[5,10,15].map(p=>({x:p+'%',ok:p===c.pct}));return k}
  const seen=new Set([cl(c.a)]),d=[],pp=all.filter(x=>x.t==='p');
  for(const x of [...shuf(pp.filter(x=>x.cat===c.cat)),...shuf(pp.filter(x=>x.cat!==c.cat))]){if(d.length>=3)break;const s=cl(x.a);if(!seen.has(s)){seen.add(s);d.push(x.a)}}
  k.o=shuf([{x:cl(c.a),ok:true},...d.map(a=>({x:cl(a),ok:false}))]);return k};
 const pool=()=>all.filter(c=>cat==='All'||c.cat===cat);
 const menu=()=>{g=null;box.innerHTML='<div class="card"><div class="lbl">🃏 Practice your knowledge</div><div class="mu" style="margin-top:6px"><b>'+all.length+'</b> multiple-choice scenarios from the processes and OKC percentages in this app. Answer every question — the correct answers and your score appear at the end of the round. Best score: <b>'+best+'</b></div><div class="lbl">Topic</div><div class="fld"><select data-fc="cat">'+cats.map(c=>'<option value="'+esc(c)+'"'+(c===cat?' selected':'')+'>'+esc(c)+' ('+all.filter(x=>c==='All'||x.cat===c).length+')</option>').join('')+'</select></div><div class="lbl">Questions per round</div><div class="fld"><select data-fc="len">'+['5','10','20','all'].map(v=>'<option value="'+v+'"'+(v===len?' selected':'')+'>'+(v==='all'?'All questions in topic':v+' questions')+'</option>').join('')+'</select></div><button class="chip on" data-fc="start" style="width:100%;justify-content:center;font-weight:700" type="button">▶️ Start round</button></div>'};
 const start=d=>{g={d:d.map(build),i:0,a:[]};draw()};
 const draw=()=>{if(g.i>=g.d.length)return end();const c=g.d[g.i],n=g.d.length,pct=Math.round(g.i/n*100);
  box.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">'+icon(c.cat==='OKC %'?'x':c.cat)+' '+esc(c.cat)+'</span><b>Question '+(g.i+1)+' / '+n+'</b></div><div style="height:6px;border-radius:6px;background:var(--bd);margin:10px 0"><div style="height:100%;width:'+pct+'%;border-radius:6px;background:linear-gradient(135deg,var(--ac),var(--ac2))"></div></div>'+
  (c.t==='p'?'<div class="lbl">Scenario</div><div class="fc-q">'+esc(c.q)+'</div><div class="mu">Which is the correct process?</div>':'<div class="lbl">'+esc(c.g)+'</div><div class="fc-q">Customer reports: “'+esc(c.q)+'”</div><div class="mu">What OKC compensation percentage applies?</div>')+
  '<div class="fc-o" style="margin-top:12px;'+(c.t==='p'?'flex-direction:column':'')+'">'+c.o.map((o,i)=>'<button class="chip" data-fc="pick" data-v="'+i+'" type="button" style="'+(c.t==='p'?'text-align:left;font-size:13px;font-weight:500;width:100%':'')+'">'+(c.t==='p'?'<b>'+'ABCD'[i]+'.</b> ':'')+esc(o.x)+'</button>').join('')+'</div></div><button class="chip" data-fc="menu" type="button">✕ Quit round</button>'};
 const end=()=>{const n=g.d.length,r=g.d.filter((c,i)=>c.o[g.a[i]].ok).length,s=r*10,pc=Math.round(r/n*100),miss=g.d.filter((c,i)=>!c.o[g.a[i]].ok);g.miss=miss;if(s>best){best=s;ST.set('pb-fcb',String(best))}
  box.innerHTML='<div class="card res"><div class="lbl">🏁 Round complete</div><div class="clk">'+s+' / '+n*10+' pts</div><div class="mu">'+r+' of '+n+' correct · '+pc+'% · Best: '+best+'</div><div class="txt"><b>'+(pc>=90?'🏆 Outstanding — you know your processes!':pc>=70?'👏 Great job, almost there.':pc>=50?'👍 Good start, keep practicing.':'📚 Review the answers below and try again.')+'</b></div><div class="row" style="margin-top:12px"><button class="chip on" data-fc="menu" type="button">🔁 New round</button>'+(miss.length?'<button class="chip" data-fc="retry" type="button">🎯 Retry missed ('+miss.length+')</button>':'')+'</div></div><div class="lbl">Answers review</div>'+
  g.d.map((c,i)=>{const ok=c.o[g.a[i]].ok,right=c.o.find(o=>o.ok);return '<div class="card" style="border-left:4px solid '+(ok?'#0b8a55':'#e03131')+'"><b>'+(ok?'✅':'❌')+' '+(i+1)+'. '+esc(c.t==='o'?'“'+c.q+'” — OKC %':c.cat+' · '+c.q)+'</b>'+(ok?'':'<div class="mu" style="margin-top:6px">Your answer: '+esc(c.o[g.a[i]].x)+'</div>')+(c.t==='o'?'<div class="txt" style="margin-top:6px">Correct: <b>'+esc(right.x)+'</b></div>':ok?'':'<div class="fc-a txt">'+fmt(c.a)+'</div>')+'</div>'}).join('')};
 box.onchange=e=>{const k=e.target.dataset.fc;if(k==='cat')cat=e.target.value;else if(k==='len')len=e.target.value};
 box.onclick=e=>{const b=e.target.closest('button[data-fc]');if(!b)return;const k=b.dataset.fc;
  if(k==='start'){const p=shuf(pool());start(len==='all'?p:p.slice(0,+len))}
  else if(k==='pick'){g.a[g.i]=+b.dataset.v;g.i++;draw()}
  else if(k==='retry')start(shuf(g.miss));
  else if(k==='menu')menu()};
 menu()}

/* ================= Announcements board ================= */
const AN_PW='expedialegacy';
let AN=J('pb-ann',[]),ACK=J('pb-ack',{}),DIS=J('pb-dis',{}),AGENT=ST.get('pb-agent')||'',ADM=false,anEd=null;
const anSave=()=>{ST.set('pb-ann',JSON.stringify(AN));ST.set('pb-ack',JSON.stringify(ACK));ST.set('pb-dis',JSON.stringify(DIS))};
const anChime=()=>{if(!pbSOn)return;pbUnlock();if(!pbAC)return;[660,880,1175].forEach((f,i)=>{const o=pbAC.createOscillator(),g=pbAC.createGain(),t=pbAC.currentTime+i*.18;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(pbAC.destination);o.start(t);o.stop(t+.5)})};
const anWhen=t=>new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const anB=document.createElement('button');anB.type='button';anB.className='an-btn';anB.innerHTML='<span>📢</span><span class="an-t">Announcements</span><span class="an-dot" id="anDot"></span>';
