document.body.append(anB,anP);
const anSm='padding:4px 8px';
function anDraw(){const live=AN.filter(a=>!DIS[a.id]),pend=live.filter(a=>!ACK[a.id]).length,list=[...live].sort((a,b)=>(!!ACK[a.id])-(!!ACK[b.id])||b.t-a.t);
 document.getElementById('anDot').style.display=pend?'block':'none';
 const hist=ADM?'<div class="lbl" style="margin-top:22px">🗂️ History (admin) · '+AN.length+' total</div>'+(AN.length?[...AN].sort((a,b)=>b.t-a.t).map(a=>'<div class="card"><b>'+esc(a.subject)+'</b>'+(DIS[a.id]?' <span class="pill">dismissed</span>':'')+'<div class="mu">By '+esc(a.name)+' · '+anWhen(a.t)+(ACK[a.id]?' · ✅ '+esc(ACK[a.id].by):'')+'</div><div class="txt">'+esc(a.body)+'</div><div class="row" style="margin-bottom:0"><button class="chip" data-an="edit" data-id="'+a.id+'" style="'+anSm+'" type="button">✏️ Edit</button><button class="chip" data-an="del" data-id="'+a.id+'" style="'+anSm+';color:#e03131" type="button">🗑️ Delete</button><button class="chip" data-an="share" data-id="'+a.id+'" style="'+anSm+'" type="button">📤 Share code</button></div></div>').join(''):'<div class="hint">No announcements published yet.</div>'):'';
 anP.innerHTML='<div class="an-h"><b>📢 Announcements'+(pend?' <span class="pill" style="background:#e03131;color:#fff">'+pend+' to acknowledge</span>':'')+'</b><span style="display:flex;gap:6px">'+(ADM?'<button class="chip" data-an="new" title="New announcement" style="'+anSm+'" type="button">➕</button><button class="chip" data-an="lock" title="Lock admin access" style="'+anSm+'" type="button">🔓</button>':'<button class="chip" data-an="pub" title="Publish (password)" style="'+anSm+'" type="button">🔒</button>')+'<button class="chip" data-an="imp" title="Import a share code" style="'+anSm+'" type="button">⬇️</button><button class="chip" data-an="x" title="Close" style="padding:4px 10px" type="button">✕</button></span></div><div class="an-b"><div class="lbl">Your name</div><div class="fld"><input id="anAg" placeholder="Enter your name to acknowledge" value="'+esc(AGENT)+'"></div>'+
 (list.length?list.map(a=>{const k=ACK[a.id];return '<div class="card" style="'+(k?'':'border-color:#e03131')+'"><div style="display:flex;gap:8px;align-items:center">'+(k?'':'<span class="an-d2"></span>')+'<b>'+esc(a.subject)+'</b></div><div class="mu">By '+esc(a.name)+' · '+anWhen(a.t)+'</div><div class="txt">'+esc(a.body)+'</div>'+(k?'<div class="mu" style="margin-top:10px">✅ Acknowledged by <b>'+esc(k.by)+'</b> · '+anWhen(k.t)+'</div><button class="chip" data-an="dis" data-id="'+a.id+'" style="width:100%;margin-top:8px;justify-content:center" type="button">🙈 Dismiss</button>':'<button class="chip on" data-an="ack" data-id="'+a.id+'" style="width:100%;margin-top:12px;justify-content:center" type="button">✓ I acknowledge</button>')+'</div>'}).join(''):'<div class="hint">'+(AN.length?'All caught up — nothing left to acknowledge.':'No announcements yet.')+'</div>')+hist+'</div>'}
function anModal(h){let m=document.getElementById('anModal');if(!m){m=document.createElement('div');m.id='anModal';document.body.appendChild(m)}m.innerHTML=h?'<div class="modal-overlay"><div class="modal-box">'+h+'</div></div>':''}
function anAskPw(){anModal('<h3 style="margin:0 0 6px">🔒 Admin access</h3><div class="mu">Enter the password to publish and manage announcements.</div><div class="fld"><input id="anPw" type="password" autocomplete="off" placeholder="Password"></div><div id="anMsg" style="color:#e03131;font-weight:600;min-height:20px"></div><div class="row"><button class="chip on" data-an="unlock" type="button">Unlock</button><button class="chip" data-an="cancel" type="button">Cancel</button></div>');const i=document.getElementById('anPw');i.focus();i.onkeydown=e=>{if(e.key==='Enter')anUnlock()}}

function anUnlock(){const i=document.getElementById('anPw');if(i.value===AN_PW){ADM=true;window.setAnnouncementAdminMode(true);anP.classList.add('open');anDraw();anForm()}else{i.value='';i.focus();document.getElementById('anMsg').textContent='Wrong password. Try again.'}}
function anForm(a){anEd=a?a.id:null;anModal('<h3 style="margin:0 0 6px">'+(a?'✏️ Edit announcement':'📝 New announcement')+'</h3><div class="lbl">Name</div><div class="fld"><input id="anN" placeholder="Your name" value="'+esc(a?a.name:AGENT)+'"></div><div class="lbl">Subject</div><div class="fld"><input id="anS" placeholder="Subject" value="'+esc(a?a.subject:'')+'"></div><div class="lbl">Content</div><div class="fld"><textarea id="anC" placeholder="Write the announcement…" style="width:100%;min-height:140px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card2);color:var(--tx);font:inherit">'+esc(a?a.body:'')+'</textarea></div><div id="anMsg" style="color:#e03131;font-weight:600;min-height:20px"></div><div class="row"><button class="chip on" data-an="publish" type="button">'+(a?'💾 Save changes':'📢 Publish')+'</button><button class="chip" data-an="cancel" type="button">Cancel</button></div>');document.getElementById(a?'anS':'anN').focus()}
const anEnc=a=>btoa(unescape(encodeURIComponent(JSON.stringify(a))));
document.addEventListener('click',e=>{
 if(e.target.closest('.an-btn')){anP.classList.toggle('open');if(anP.classList.contains('open'))anDraw();return}
 const b=e.target.closest('[data-an]');if(!b)return;const k=b.dataset.an,id=b.dataset.id;
 if(k==='x')anP.classList.remove('open');
 else if(k==='pub')anAskPw();
 else if(k==='new')anForm();
 else if(k==='lock'){ADM=false;anDraw()}
 else if(k==='unlock')anUnlock();
 else if(k==='cancel'){anEd=null;anModal('')}
 else if(k==='publish'){const n=anN.value.trim(),s=anS.value.trim(),c=anC.value.trim();if(!n||!s||!c){anMsg.textContent='Please fill in name, subject and content.';return}
  if(anEd){const a=AN.find(x=>x.id===anEd);if(a){a.name=n;a.subject=s;a.body=c}}
  else{AGENT=AGENT||n;ST.set('pb-agent',AGENT);AN.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,subject:s,body:c,t:Date.now()})}
  const nw=!anEd;anEd=null;anSave();anModal('');anP.classList.add('open');anDraw();if(nw)anChime()}
 else if(k==='edit'){const a=AN.find(x=>x.id===id);if(a)anForm(a)}
 else if(k==='del'){const a=AN.find(x=>x.id===id);if(a)anModal('<h3 style="margin:0 0 6px">🗑️ Delete announcement?</h3><div class="txt" style="margin:8px 0 16px">“'+esc(a.subject)+'” will be removed permanently.</div><div class="row"><button class="chip no" data-an="delok" data-id="'+id+'" type="button">Yes, delete</button><button class="chip" data-an="cancel" type="button">Cancel</button></div>')}
 else if(k==='delok'){AN=AN.filter(x=>x.id!==id);delete ACK[id];delete DIS[id];anSave();anModal('');anDraw()}
 else if(k==='ack'){const nm=document.getElementById('anAg');AGENT=nm.value.trim();if(!AGENT){nm.style.borderColor='#e03131';nm.placeholder='Name required to acknowledge';nm.focus();return}
  ST.set('pb-agent',AGENT);ACK[id]={by:AGENT,t:Date.now()};anSave();anDraw()}
 else if(k==='dis'){if(ACK[id]){DIS[id]=1;anSave();anDraw()}}
 else if(k==='share'){const a=AN.find(x=>x.id===id);if(a)cpy(b,anEnc(a))}
 else if(k==='imp')anModal('<h3 style="margin:0 0 6px">⬇️ Import announcement</h3><div class="mu">Paste the share code.</div><div class="fld"><textarea id="anCode" style="width:100%;min-height:90px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card2);color:var(--tx);font:inherit"></textarea></div><div id="anMsg" style="color:#e03131;font-weight:600;min-height:20px"></div><div class="row"><button class="chip on" data-an="impok" type="button">Import</button><button class="chip" data-an="cancel" type="button">Cancel</button></div>')
 else if(k==='impok'){try{const a=JSON.parse(decodeURIComponent(escape(atob(anCode.value.trim()))));if(!(a.id&&a.subject&&a.body))throw 0;const isNew=!AN.some(x=>x.id===a.id);if(isNew)AN.push({id:String(a.id),name:String(a.name||''),subject:String(a.subject),body:String(a.body),t:+a.t||Date.now()});anSave();anModal('');anDraw();if(isNew)anChime()}catch(x){anMsg.textContent='That code is not valid.'}}});
anP.addEventListener('input',e=>{if(e.target.id==='anAg'){AGENT=e.target.value;ST.set('pb-agent',AGENT)}});
addEventListener('keydown',e=>{if(e.key==='Escape'){anModal('');anP.classList.remove('open')}});
/* sound: new announcement from another tab, and a reminder on first tap if something is waiting */
addEventListener('storage',e=>{if(e.key!=='pb-ann'&&e.key!=='pb-ack'&&e.key!=='pb-dis')return;const before=new Set(AN.map(a=>a.id));AN=J('pb-ann',[]);ACK=J('pb-ack',{});DIS=J('pb-dis',{});if(AN.some(a=>!before.has(a.id)&&!ACK[a.id]))anChime();anDraw()});
addEventListener('pointerdown',()=>{if(AN.some(a=>!ACK[a.id]&&!DIS[a.id]))setTimeout(anChime,80)},{once:true});
anDraw();

(()=>{
'use strict';
const $=id=>document.getElementById(id), key='pb-sim-scenarios-v1', cfgKey='pb-admin-config-v1';
const escH=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn('Performance Booster: browser storage is unavailable; changes may not persist.',e);return false}};
let scenarios=read(key,[]), config=read(cfgKey,{links:[],templates:[],rules:[]}),admin=false,simStep=0,simAnswers=[],activeScenario=null,editingScenarioId=null;
const roleBtn=$('roleSwitch');
function syncRole(){if(roleBtn){roleBtn.textContent=admin?'Admin View · Click to exit':'Agent View · Admin Console';roleBtn.classList.toggle('admin',admin);roleBtn.setAttribute('aria-pressed',String(admin));}if(typeof window.setAnnouncementAdminMode==='function')window.setAnnouncementAdminMode(admin);}
if(roleBtn)roleBtn.addEventListener('click',()=>{if(admin){admin=false;syncRole();const m=$('simModal');if(m)m.innerHTML='';return}askAdmin()});
if(!scenarios.length){
 scenarios=[
 {id:'seed-hotel-change',product:'Hotel',title:'Hotel date change with no availability',description:'Explore availability, alternatives and clear expectations.',steps:[
 {chat:'Customer: “I need to move my stay to different dates. Can you change it?”',question:'What should you check first?',options:['Check the booking terms and availability for the requested dates','Promise the change before checking availability','Cancel immediately'],correct:0,explanation:'Review terms and availability before confirming a change.'},
 {chat:'The requested dates are unavailable at the property.',question:'What is the best next step?',options:['Tell the customer the hotel must accept it','Explain the availability issue and discuss permitted alternatives under the booking terms','Change the dates anyway'],correct:1,explanation:'Set accurate expectations and offer only options supported by the booking terms.'},
 {chat:'The customer chooses an alternative option.',question:'Before finishing, what should you do?',options:['Recap the agreed change, any price difference and confirmation details','End chat without recap','Promise all future changes are free'],correct:0,explanation:'Recap the confirmed outcome and any applicable costs.'}]},
 {id:'seed-car-pickup',product:'Cars',title:'Rental car unavailable at pickup',description:'Verify with the rental counter, rebook and document.',steps:[
 {chat:'Customer: “I arrived and the rental desk says there is no car for my reservation.”',question:'What should you do first?',options:['Confirm the vehicle is unavailable with the rental counter','Immediately promise a refund and compensation','Tell the customer to book elsewhere without checking'],correct:0,explanation:'Confirm the issue with the rental counter and follow the process for the payment type.'},
 {chat:'The rental company confirms no vehicle is available.',question:'What should guide the next steps?',options:['Merchant-of-record/payment type and the applicable cancellation/refund workflow','Always issue the refund yourself','Ignore the original booking'],correct:0,explanation:'The correct refund route depends on the payment type and merchant of record.'},
 {chat:'You help the traveler find an alternative rental.',question:'What should the case notes include?',options:['Only “resolved”','Confirmation of the issue, supplier contact and alternate booking/price difference details','No notes are needed'],correct:1,explanation:'Clear notes make the decision and any covered price difference traceable.'}]},
 {id:'seed-insurance',product:'Insurance',title:'Insurance cancellation eligibility',description:'Check eligibility rather than assuming every booking can be refunded.',steps:[
 {chat:'Customer: “I cancelled my hotel, so cancel my travel insurance too.”',question:'What should you verify?',options:['Whether a listed insurance cancellation scenario applies, including timing and trip/claim status','Assume the insurance is automatically refundable','Cancel it only because the hotel was non-refundable'],correct:0,explanation:'Insurance has its own eligibility rules; a non-refundable hotel alone is not a reason.'},
 {chat:'The customer says the trip has not started and purchase was within 15 days.',question:'What is the right next step?',options:['Check the remaining policy conditions and booking details before processing','Guarantee approval without checking','Tell them insurance can never be cancelled'],correct:0,explanation:'Verify all applicable conditions before taking action.'}]},
 {id:'seed-activity',product:'Activity',title:'Third-party activity cancellation',description:'Distinguish refundable and non-refundable third-party requests.',steps:[
 {chat:'Customer wants to cancel a third-party activity and the booking is non-refundable.',question:'What does the supplied process say to do?',options:['Call the activity provider directly','Email the appropriate third-party partner for cancellation/refund approval','Promise a refund'],correct:1,explanation:'For the supplied third-party non-refundable process, partner email approval is required.'},
 {chat:'The activity provider verbally says a refund is fine.',question:'Is that enough to process the third-party refund?',options:['Yes, verbal supplier approval always overrides the process','No, the applicable third-party partner email approval is required','Cancel without documenting anything'],correct:1,explanation:'Follow the third-party approval route rather than relying on verbal provider approval.'}]},
 {id:'seed-loyalty',product:'Loyalty(Onekeycash+Gift cards)',title:'Missing OneKeyCash',description:'Verify eligibility and timing before adjustment.',steps:[
 {chat:'Customer says their OneKeyCash has not appeared after a completed trip.',question:'What should you verify first?',options:['Booking eligibility and whether the earn confirmation timeframe has passed','Immediately issue a duplicate adjustment','Tell them rewards are never earned'],correct:0,explanation:'Confirm eligibility and the expected confirmation window first.'},
 {chat:'The booking is eligible and the confirmation window has passed.',question:'What should you do next?',options:['Check relevant loyalty history/tools and follow the adjustment process if rewards are still missing','Make multiple adjustments without checking','Ask the customer to book again'],correct:0,explanation:'Check the records and avoid duplicate adjustments.'}]}
 ];save(key,scenarios);
}
const products=()=>{try{return JSON.parse($('d').textContent).products.map(p=>p.name)}catch{return ['Hotel','Cars','Insurance','Activity','Loyalty','Other']}};
const known=()=>{try{return JSON.parse($('d').textContent).products}catch{return []}};
const addBtn=(label,act,cls='chip')=>`<button type="button" class="${cls}" data-simact="${act}">${label}</button>`;
const modal=(title,body)=>{let el=$('simModal');if(!el){el=document.createElement('div');el.id='simModal';document.body.append(el)}el.innerHTML=`<div class="modal-overlay"><section class="modal-box" style="max-width:900px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">${title}</h2>${addBtn('✕','close')}</div><div id="simModalBody">${body}</div></section></div>`;el.querySelector('[data-simact="close"]').onclick=()=>el.innerHTML='';el.onclick=e=>{if(e.target.classList.contains('modal-overlay'))el.innerHTML=''};};
function addSidebar(){const customK=read('pb-knowledge-custom',null);if(customK&&$('d'))$('d').textContent=JSON.stringify({products:customK});if(Array.isArray(window.EMT)){config.templates.forEach((t,i)=>{if(!EMT.some(e=>e.id==='custom-'+i))EMT.push({id:'custom-'+i,name:t.name,body:t.body.replace(/\[([^\]]+)\]/g,(_,p)=>'{'+p.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'|'+p+'}')})})}const nav=$('sidebarToolsList');if(!nav)return;nav.querySelectorAll('[data-simopen],[data-adminopen],[data-custom-link]').forEach(x=>x.remove());const b=document.createElement('button');b.className='tl';b.style.width='100%';b.style.textAlign='left';b.innerHTML='<span>🎭</span> Simulation';b.dataset.simopen='1';b.onclick=openSim;nav.append(b);config.links.forEach((x,i)=>{const l=document.createElement('a');l.className='tl';l.href=x.url;l.target='_blank';l.rel='noopener noreferrer';l.innerHTML='<span>🔗</span> '+escH(x.name);l.dataset.customLink=i;nav.append(l)})}
function openSim(){const names=products();modal('🎭 Simulation','<p class="mu">Choose a product and practise a multi-step customer chat. Scenarios are authored by admins in this browser.</p><div class="fld"><label>Product</label><select id="simProduct">'+names.map(n=>`<option>${escH(n)}</option>`).join('')+'</select></div><div id="simScenarioList"></div>');const draw=()=>{const prod=$('simProduct').value;const list=scenarios.filter(x=>x.product===prod);$('simScenarioList').innerHTML=list.length?list.map((x,i)=>`<div class="card"><b>${escH(x.title)}</b><p class="mu">${escH(x.description||'')} · ${(x.steps||[]).length} steps</p>${addBtn('Start scenario','start:'+i)}</div>`).join(''):'<div class="hint">No custom scenarios yet. Use Admin Console to create one, or practise with the built-in sample scenario.</div>'+addBtn('Start sample scenario','sample');};$('simProduct').onchange=draw;draw();}
function startScenario(sc){activeScenario=sc;simStep=0;simAnswers=[];renderStep()}
function renderStep(){if(!activeScenario)return;const st=activeScenario.steps[simStep];if(!st){const correct=simAnswers.filter(x=>x.correct).length;modal('Simulation complete',`<div class="stats"><div class="st"><span class="mu">Score</span><b>${correct}/${simAnswers.length}</b></div><div class="st"><span class="mu">Accuracy</span><b>${simAnswers.length?Math.round(correct/simAnswers.length*100):0}%</b></div></div><h3>Review</h3>${simAnswers.map((x,i)=>`<div class="card"><b>Step ${i+1}: ${escH(x.question)}</b><p>${x.correct?'✅ Correct':'❌ Needs review'}</p><p class="mu">Best answer: ${escH(x.best)}</p><p>${escH(x.explanation||'')}</p></div>`).join('')}${addBtn('Back to scenarios','backSim')}</div>`);return}
modal(`🎭 ${escH(activeScenario.title)} · Step ${simStep+1}/${activeScenario.steps.length}`,`<div class="card"><div class="pill">Customer chat</div><p style="font-size:16px">${escH(st.chat||st.question)}</p></div><h3>${escH(st.question||'What should you do next?')}</h3><div id="simOptions">${(st.options||[]).map((o,i)=>`<label class="card" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="radio" name="simChoice" value="${i}" style="width:auto;margin-top:5px"><span>${escH(o)}</span></label>`).join('')}</div><div id="simFeedback"></div><div class="row">${addBtn('Submit answer','submitAnswer','chip on')}${addBtn('Exit','close')}</div>`);$('simModalBody').dataset.step=simStep;}
function sample(){startScenario({title:'Hotel cancellation request (sample)',product:'Hotel',description:'Practice checking terms and handling expectations.',steps:[{chat:'Customer: “I need to cancel my hotel booking. Can you refund me?”',question:'What should you verify first?',options:['Check the booking refundability and payment type','Promise a full refund immediately','Cancel without reviewing the booking'],correct:0,explanation:'Verify booking terms and payment details before promising an outcome.'},{chat:'You confirm the booking is non-refundable and Pay Now.',question:'What is the best next step?',options:['Tell the customer a refund is guaranteed','Contact the hotel to request an exception and explain approval is not guaranteed','Cancel and promise the money back'],correct:1,explanation:'For a non-refundable Pay Now hotel booking, request a supplier exception and set clear expectations.'},{chat:'The hotel has not replied yet.',question:'What should you do if no response is received?',options:['Tell the customer it is approved','Follow the applicable process, send the required email and assign an SR if required','Close the case without notes'],correct:1,explanation:'Follow the applicable process, document actions and use the required follow-up path.'}]})}
function askAdmin(){modal('🛡️ Admin access','<p class="mu">Enter the announcements admin password for full access to the local admin tools.</p><div class="fld"><input id="adminPw" type="password" autocomplete="current-password" placeholder="Password"></div><div id="adminErr" style="color:#e03131"></div>'+addBtn('Unlock admin access','unlockAdmin','chip on'));$('adminPw').focus();$('adminPw').onkeydown=e=>{if(e.key==='Enter')unlock()};}
function unlock(){if($('adminPw').value==='expedialegacy'){admin=true;syncRole();adminPanel()}else $('adminErr').textContent='Incorrect password.'}
function adminPanel(tab='sim'){if(!admin)return askAdmin();const tabs=[['sim','Simulation scenarios'],['knowledge','Knowledge editor'],['links','Tool links'],['emails','Email templates'],['rules','Escalation checker'],['backup','Backup / restore']];modal('🛡️ Admin Console',`<p class="mu">Changes are saved in this browser. Knowledge edits update the in-page product knowledge JSON for this session and persist locally; this standalone HTML cannot publish changes to other agents or a central server.</p><div class="tabs">${tabs.map(t=>`<button class="tab ${t[0]===tab?'on':''}" data-admin-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="adminContent"></div>`);$('simModalBody').querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>adminPanel(b.dataset.adminTab));const c=$('adminContent');if(tab==='sim')scenarioAdmin(c);if(tab==='knowledge')knowledgeAdmin(c);if(tab==='links')linksAdmin(c);if(tab==='emails')emailAdmin(c);if(tab==='rules')rulesAdmin(c);if(tab==='backup')backupAdmin(c)}
function scenarioAdmin(c){c.innerHTML=`<h3>Create / edit scenario</h3><div class="fld"><label>Product</label><select id="scProd">${products().map(p=>`<option>${escH(p)}</option>`).join('')}</select></div><div class="fld"><label>Scenario title</label><input id="scTitle" placeholder="e.g. Non-refundable hotel exception"></div><div class="fld"><label>Description</label><input id="scDesc" placeholder="Learning objective"></div><div class="fld"><label>Steps (one JSON object per line)</label><textarea id="scSteps" rows="7" placeholder='{"chat":"Customer says…","question":"What do you do?","options":["A","B","C"],"correct":1,"explanation":"Why this is best."}'></textarea><p class="mu">Each step needs chat, question, options (array), correct (zero-based option index), and optional explanation. Add multiple JSON objects separated by new lines.</p></div>${addBtn('Save scenario','saveScenario','chip on')}<h3>Saved scenarios</h3><div id="savedScenarios"></div>`;const list=()=>{$('savedScenarios').innerHTML=scenarios.length?scenarios.map((x,i)=>`<div class="card"><b>${escH(x.title)}</b><div class="mu">${escH(x.product)} · ${(x.steps||[]).length} steps</div>${addBtn('Edit','editScenario:'+i)} ${addBtn('Delete','deleteScenario:'+i)}</div>`).join(''):'<div class="hint">No scenarios saved.</div>'};list();c._list=list}
function saveScenario(){try{const product=$('scProd').value,title=$('scTitle').value.trim();if(!title)throw Error('Enter a scenario title.');const lines=$('scSteps').value.split('\n').map(x=>x.trim()).filter(Boolean),steps=lines.map(x=>JSON.parse(x));if(!steps.length)throw Error('Add at least one step.');steps.forEach((x,i)=>{if(!x.question||!Array.isArray(x.options)||x.options.length<2||x.options.some(o=>typeof o!=='string'||!o.trim())||!Number.isInteger(x.correct)||x.correct<0||x.correct>=x.options.length)throw Error('Step '+(i+1)+' needs a question, at least two options, and a valid correct index.')});const sc={id:editingScenarioId??Date.now(),product,title,description:$('scDesc').value.trim(),steps};if(editingScenarioId!==null){const ix=scenarios.findIndex(z=>z.id===editingScenarioId);if(ix>=0)scenarios[ix]=sc;else scenarios.push(sc)}else scenarios.push(sc);editingScenarioId=null;save(key,scenarios);adminPanel('sim')}catch(e){alert(e.message||'Could not save scenario')}}
function knowledgeAdmin(c){const ps=known();c.innerHTML=`<p class="mu">Choose a product and edit its existing knowledge entries. This creates a local editable copy; use export to retain it with the HTML.</p><div class="fld"><label>Product</label><select id="knProd">${ps.map((p,i)=>`<option value="${i}">${escH(p.name)}</option>`).join('')}</select></div><div class="fld"><label>Knowledge path / topic</label><input id="knPath" placeholder="e.g. Non Refundable / Pay now / Cancel"></div><div class="fld"><label>Knowledge text / process</label><textarea id="knText" rows="6" placeholder="Enter the process…"></textarea></div>${addBtn('Add knowledge entry','addKnowledge','chip on')}<hr><div id="knExisting"></div>`;const draw=()=>{const p=ps[+$('knProd').value];$('knExisting').innerHTML=(p.entries||[]).map((e,i)=>`<div class="card"><b>${escH((e.path||[]).join(' › '))}</b><p class="mu">${escH((e.text||'').slice(0,220))}${(e.text||'').length>220?'…':''}</p>${addBtn('Load to editor','loadKnowledge:'+i)} ${addBtn('Delete entry','delKnowledge:'+i)}</div>`).join('')};$('knProd').onchange=draw;draw();c._knowledgeDraw=draw}
function addKnowledge(){const ps=known(),p=ps[+$('knProd').value],path=$('knPath').value.split('/').map(x=>x.trim()).filter(Boolean),text=$('knText').value.trim();if(!path.length||!text)return alert('Enter a topic/path and process text.');p.entries.push({path,text});persistKnowledge(ps);adminPanel('knowledge')}
function persistKnowledge(ps){const el=$('d');el.textContent=JSON.stringify({products:ps});save('pb-knowledge-custom',ps);alert('Knowledge saved in this browser. Export the HTML/JSON backup to carry it to another copy.')}
function linksAdmin(c){c.innerHTML=`<h3>Add a navigation link</h3><div class="fld"><label>Link name</label><input id="lnName" placeholder="Knowledge article"></div><div class="fld"><label>URL</label><input id="lnUrl" placeholder="https://…"></div>${addBtn('Add link','addLink','chip on')}<div id="lnList"></div>`;const draw=()=>{$('lnList').innerHTML=config.links.map((x,i)=>`<div class="card"><b>${escH(x.name)}</b><p class="mu">${escH(x.url)}</p>${addBtn('Delete','delLink:'+i)}</div>`).join('')||'<div class="hint">No custom links.</div>'};draw()}
function emailAdmin(c){c.innerHTML=`<h3>Add / edit email template</h3><div class="fld"><label>Template name / header</label><input id="emName" placeholder="Hotel follow-up"></div><div class="fld"><label>Template body</label><textarea id="emBody" rows="8" placeholder="Hello [Customer name],&#10;Regarding [booking reference]…"></textarea><p class="mu">Any text inside [square brackets] becomes a fill-in field automatically when used.</p></div>${addBtn('Save template','addEmail','chip on')}<div id="emList"></div>`;const draw=()=>{$('emList').innerHTML=config.templates.map((x,i)=>`<div class="card"><b>${escH(x.name)}</b><p class="mu">${escH(x.body.slice(0,180))}</p>${addBtn('Edit','editEmail:'+i)} ${addBtn('Delete','delEmail:'+i)}</div>`).join('')||'<div class="hint">No custom templates.</div>'};draw()}
function rulesAdmin(c){c.innerHTML=`<h3>Escalation checker rules</h3><div class="fld"><label>Rule name</label><input id="ruName" placeholder="Supplier cannot accommodate"></div><div class="fld"><label>Trigger / condition</label><input id="ruTrigger" placeholder="When the hotel cannot accommodate"></div><div class="fld"><label>Recommended action</label><textarea id="ruAction" rows="3" placeholder="Transfer to…"></textarea></div>${addBtn('Add rule','addRule','chip on')}<div id="ruList"></div>`;const draw=()=>{$('ruList').innerHTML=config.rules.map((x,i)=>`<div class="card"><b>${escH(x.name)}</b><p>${escH(x.trigger)}</p><p class="mu">${escH(x.action)}</p>${addBtn('Edit','editRule:'+i)} ${addBtn('Delete','delRule:'+i)}</div>`).join('')||'<div class="hint">No custom rules.</div>'};draw()}
function backupAdmin(c){c.innerHTML=`<p>Export custom scenarios, links, templates, escalation rules and knowledge edits as JSON. Import it on another copy of this tool.</p><div class="row">${addBtn('Export JSON','exportData','chip on')} ${addBtn('Import JSON','importData')}</div><textarea id="backupText" rows="10" placeholder="Export appears here; paste JSON here to import."></textarea>${addBtn('Import pasted JSON','applyImport','chip on')}`}
function act(e){const b=e.target.closest('[data-simact]');if(!b)return;const a=b.dataset.simact;if(a==='unlockAdmin')return unlock();if(a==='sample')return sample();if(a==='backSim')return openSim();if(a.startsWith('start:')){const prod=$('simProduct').value,list=scenarios.filter(x=>x.product===prod);return startScenario(list[+a.split(':')[1]])}if(a==='submitAnswer'){const i=+$('simModalBody').querySelector('input[name="simChoice"]:checked')?.value;if(!Number.isInteger(i))return alert('Select an answer first.');const st=activeScenario.steps[simStep];simAnswers.push({question:st.question,correct:i===st.correct,best:st.options[st.correct],explanation:st.explanation||''});simStep++;return renderStep()}if(a==='saveScenario')return saveScenario();if(a==='addKnowledge')return addKnowledge();if(a==='addLink'){const name=$('lnName').value.trim(),url=$('lnUrl').value.trim();if(!name||!/^https?:\/\//i.test(url))return alert('Enter a name and a valid http(s) URL.');config.links.push({name,url});save(cfgKey,config);addSidebar();return adminPanel('links')}if(a==='addEmail'){const name=$('emName').value.trim(),body=$('emBody').value;if(!name||!body.trim())return alert('Enter a template name and body.');config.templates.push({name,body});save(cfgKey,config);if(Array.isArray(window.EMT))EMT.push({id:'custom-'+(config.templates.length-1),name,body:body.replace(/\[([^\]]+)\]/g,(_,p)=>'{'+p.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'|'+p+'}')});return adminPanel('emails')}if(a==='addRule'){const name=$('ruName').value.trim(),trigger=$('ruTrigger').value.trim(),action=$('ruAction').value.trim();if(!name||!trigger||!action)return alert('Complete all rule fields.');config.rules.push({name,trigger,action});save(cfgKey,config);return adminPanel('rules')}if(a==='exportData'){const payload={scenarios,config,knowledge:read('pb-knowledge-custom',null)};$('backupText').value=JSON.stringify(payload,null,2);return}if(a==='applyImport'){try{const v=JSON.parse($('backupText').value);if(v.scenarios)scenarios=v.scenarios;if(v.config)config=v.config;if(v.knowledge)save('pb-knowledge-custom',v.knowledge);save(key,scenarios);save(cfgKey,config);alert('Imported.');adminPanel('backup')}catch(err){alert('Invalid JSON: '+err.message)}return}if(a.startsWith('deleteScenario:')){scenarios.splice(+a.split(':')[1],1);save(key,scenarios);return adminPanel('sim')}if(a.startsWith('editScenario:')){const x=scenarios[+a.split(':')[1]];editingScenarioId=x.id;adminPanel('sim');setTimeout(()=>{const f=$('adminContent');if(!f)return;$('scProd').value=x.product;$('scTitle').value=x.title;$('scDesc').value=x.description||'';$('scSteps').value=x.steps.map(y=>JSON.stringify(y)).join('\n');},0);return}if(a.startsWith('delLink:')){config.links.splice(+a.split(':')[1],1);save(cfgKey,config);return adminPanel('links')}if(a.startsWith('delEmail:')){config.templates.splice(+a.split(':')[1],1);save(cfgKey,config);return adminPanel('emails')}if(a.startsWith('editEmail:')){const x=config.templates[+a.split(':')[1]];adminPanel('emails');setTimeout(()=>{$('emName').value=x.name;$('emBody').value=x.body},0);return}if(a.startsWith('delRule:')){config.rules.splice(+a.split(':')[1],1);save(cfgKey,config);return adminPanel('rules')}if(a.startsWith('editRule:')){const x=config.rules[+a.split(':')[1]];adminPanel('rules');setTimeout(()=>{$('ruName').value=x.name;$('ruTrigger').value=x.trigger;$('ruAction').value=x.action},0);return}if(a.startsWith('loadKnowledge:')){const p=known()[+$('knProd').value],x=p.entries[+a.split(':')[1]];$('knPath').value=x.path.join(' / ');$('knText').value=x.text;return}if(a.startsWith('delKnowledge:')){const ps=known();ps[+$('knProd').value].entries.splice(+a.split(':')[1],1);persistKnowledge(ps);return adminPanel('knowledge')}}
document.addEventListener('click',act);
document.addEventListener('click',e=>{if(e.target.closest('[data-simopen]'))openSim();if(e.target.closest('[data-adminopen]'))admin?adminPanel():askAdmin()});
const oldOpen=window.openToolModal; // keep existing tools unchanged
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{addSidebar();syncRole()});else{addSidebar();syncRole()}
})();
</script>

</body>
</html>
