<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Performance Booster</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2fb;
  --card:rgba(255,255,255,.74);
  --card2:rgba(255,255,255,.93);
  --tx:#14203a;
  --mu:#5a6785;
  --bd:rgba(20,32,70,.13);
  --grid:rgba(30,50,110,.05);
  --gs:16%;
  --sh:0 8px 30px rgba(20,40,100,.10);
  --ac:#2f6bff;
  --ac2:#5b5bf0;
  --sidebar-w: 240px;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: auto;
  overflow-y: auto;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a1020;
    --card:rgba(22,30,54,.68);
    --card2:rgba(34,45,78,.9);
    --tx:#e9eefc;
    --mu:#9aa8c9;
    --bd:rgba(150,170,255,.17);
    --grid:rgba(160,180,255,.045);
    --gs:30%;
    --sh:0 10px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1020;
  --card:rgba(22,30,54,.68);
  --card2:rgba(34,45,78,.9);
  --tx:#e9eefc;
  --mu:#9aa8c9;
  --bd:rgba(150,170,255,.17);
  --grid:rgba(160,180,255,.045);
  --gs:30%;
  --sh:0 10px 34px rgba(0,0,0,.45);
}
:root[data-a="violet"]{--ac:#7048e8;--ac2:#a23de0}
:root[data-a="emerald"]{--ac:#0b8a55;--ac2:#0a8f8f}
:root[data-a="sunset"]{--ac:#d9480f;--ac2:#e8590c}
:root[data-a="yellow"]{--ac:#e6a100;--ac2:#f59f00}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--tx);
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-width: 320px;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60rem 40rem at 8% -10%,color-mix(in srgb,var(--ac) var(--gs),transparent),transparent 60%),
             radial-gradient(50rem 40rem at 100% 100%,color-mix(in srgb,var(--ac2) var(--gs),transparent),transparent 60%),
             linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,
             linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px;
}

/* Scrollbars styling */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.05);
}
::-webkit-scrollbar-thumb {
  background: var(--bd);
  border-radius: 5px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--ac);
}

.w{
  width:100%;
  max-width: 100%;
  margin:0 auto;
  padding:18px 24px 40px;
  transition: padding-left 0.3s ease;
}

/* Sidebar Toggle & Drawer */
.sidebar-toggle-btn {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10001;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: var(--card2);
  color: var(--tx);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: var(--sh);
  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, background-color 0.2s ease;
}
.sidebar-toggle-btn:hover {
  border-color: var(--ac);
  transform: translateY(-1px);
}

.left-sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  z-index: 10000;
  background: var(--card2);
  border-right: 1px solid var(--bd);
  backdrop-filter: blur(16px);
  box-shadow: 4px 0 25px rgba(0,0,0,0.15);
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  padding: 60px 12px 20px 12px;
  overflow-y: auto;
}
.left-sidebar.open {
  transform: translateX(0);
}

.sidebar-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mu);
  margin-bottom: 12px;
  padding-left: 6px;
}

.sidebar-tools-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.hero{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px 20px;
  margin-top: 36px;
  border:1px solid var(--bd);
  border-radius:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),var(--card);
  backdrop-filter:blur(14px);
  box-shadow:var(--sh);
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 45%,transparent);
}
h1{font-size:21px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mu);font-size:13px}
.ctl{display:flex;align-items:center;gap:12px}
#dots{display:flex;gap:8px}
.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;font-size:17px;display:grid;place-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer}
.dot.on{outline:2px solid var(--tx);outline-offset:2px}

.srch,.amt{position:relative}
.srch{margin:16px 0 4px}
.srch span,.amt span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
input,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card2);color:var(--tx);font:inherit}
input[type=search]{-webkit-appearance:none;appearance:none;padding-left:42px}
.amt input{padding-left:30px}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Tabs with horizontal scrollable bar */
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  white-space: nowrap;
  padding:8px 2px 12px;
  margin-top:6px;
  scrollbar-width: auto;
}
.tab{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border:1px solid var(--bd);
  border-radius:14px;
  background:var(--card);
  backdrop-filter:blur(10px);
  color:var(--tx);
  font:inherit;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
}
.tab span{font-size:18px}
.tab:hover,.chip:hover{border-color:var(--ac)}
.tab.on,.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.tab.on{box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 40%,transparent)}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.fld{margin:8px 0 14px}
.chip{padding:9px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
.lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-top:10px}
.n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;backdrop-filter:blur(14px);box-shadow:var(--sh)}
.res{border-left:4px solid var(--ac);animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:color-mix(in srgb,var(--ac) 60%,var(--tx));background:color-mix(in srgb,var(--ac) 14%,transparent)}
.txt{white-space:pre-wrap;word-break:break-word;margin-top:12px}
.hit{display:block;width:100%;text-align:left;cursor:pointer;color:var(--tx);font:inherit;transition:.15s}
.hit:hover{border-color:var(--ac);transform:translateY(-1px)}
.mu{color:var(--mu);font-size:13px}
a{color:color-mix(in srgb,var(--ac) 60%,var(--tx))}
mark{background:color-mix(in srgb,var(--ac) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.hint{text-align:center;color:var(--mu);padding:22px 10px;border:1px dashed var(--bd);border-radius:16px;margin-top:8px}
.cp{margin-top:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--card2)}
.st b{display:block;font-size:22px;margin-top:2px}
.st.big{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.st.big .mu{color:rgba(255,255,255,.88)}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:28px}

#scene{position:fixed;inset:0;z-index:-1;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
.sa{fill:var(--ac)}.sb{fill:var(--ac2)}.sc{fill:var(--tx)}
.bl{animation:fl 7s ease-in-out infinite alternate;will-change:transform}
.pb-hidden .bl,.pb-hidden .chip,.pb-hidden #pbTutBtn{animation-play-state:paused!important}
button,.chip,.tab,select{touch-action:manipulation}
@keyframes fl{to{transform:translateY(-24px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.clk{font-weight:700;font-size:40px;line-height:1.1;margin:10px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tool-win .tw-m{padding:4px 12px;font-weight:bold;font-size:16px;cursor:pointer}
#dock{position:fixed;left:8px;bottom:8px;z-index:10003;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 16px)}#dock .chip{box-shadow:var(--sh)}
.clk.warn{color:#e6a100}.clk.over{color:#e03131}
.clk.end{color:color-mix(in srgb,var(--ac) 70%,var(--tx))}
.tools{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.tl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);text-decoration:none;font-weight:600;font-size:13px;transition:.15s}
.tl:hover{border-color:var(--ac);transform:translateX(3px)}
.tl span{font-size:16px}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* Modal Popup for Urgent Client Updates & Activity Reminders */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10005;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn .2s ease;
}
.modal-box {
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 20px;
  max-width: 600px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--sh);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* Draggable tool windows */
.tool-win{position:fixed;z-index:10002;width:420px;max-width:calc(100vw - 16px);max-height:85vh;display:flex;flex-direction:column;background:var(--card2);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.tool-win .tw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:move;user-select:none;touch-action:none;border-radius:16px 16px 0 0}
.tool-win .tw-title{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.tool-win .tw-x{padding:4px 12px;font-weight:bold;font-size:16px;cursor:pointer}
.tool-win .tw-body{padding:12px;overflow:auto}
#wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;user-select:none;width:min(78vw,520px);opacity:.1}
#wm svg{display:block;width:100%;height:auto}
#wm .sq{fill:#1a2a6c}
#wm .tx{fill:var(--tx)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #wm{opacity:.14}
  :root:not([data-theme="light"]) #wm .sq{fill:#5b74e8}
}
:root[data-theme="dark"] #wm{opacity:.14}
:root[data-theme="dark"] #wm .sq{fill:#5b74e8}
</style>
<style>
@keyframes pbWIn{from{opacity:0}to{opacity:1}}
@keyframes pbWCard{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pbWHint{0%,100%{opacity:.55}50%{opacity:1}}
/* lightweight: no backdrop blur, no will-change, short animations */
#pbWelcome{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;background:rgba(12,20,44,.66);animation:pbWIn .15s ease both;transition:opacity .2s ease}
#pbWelcome.out{opacity:0;pointer-events:none}
#pbWelcome [hidden]{display:none!important}
#pbWelcome .wc{width:min(440px,100%);padding:34px 28px 26px;text-align:center;border-radius:28px;color:var(--tx);background:var(--card2);border:1px solid var(--bd);box-shadow:0 14px 40px rgba(0,0,0,.28);animation:pbWCard .25s cubic-bezier(.2,1,.3,1) both}
#pbWelcome .wchg{margin-top:12px;font:inherit;font-size:12px;color:var(--tx);opacity:.75;text-decoration:underline;cursor:pointer;background:none;border:0;padding:4px 8px}
#pbWelcome .wh{font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0;color:var(--ac);word-break:break-word}
#pbWelcome .ws{margin:10px 0 0;color:var(--tx);opacity:.8;font-size:15px}
#pbWelcome .wt{margin:22px 0 0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx);animation:pbWHint 1.8s ease-in-out infinite}
#pbWelcome .wn{margin-top:16px;display:flex;gap:8px;justify-content:center}
#pbWelcome .wn input{width:min(220px,100%);text-align:center;padding:11px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
#pbWelcome .wn input::placeholder{color:var(--mu)}
#pbWelcome .wok{padding:11px 16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
#pbWelcome .wsrc{margin:8px 0 0;font-size:11px;opacity:.65}
.pbhi{margin:4px 0 0;font-size:13px;font-weight:600;color:var(--tx);min-height:22px}
.pbhn{font:inherit;color:var(--ac);background:none;border:0;border-bottom:1px dashed currentColor;padding:0;cursor:pointer}
.pbw{cursor:pointer;display:inline-block;user-select:none;-webkit-user-select:none}
.pbhi .pbin{width:140px;max-width:46vw;padding:2px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:inherit;display:inline-block}
</style>
</head>
<body>
<script>
/* ===== PBU core + welcome screen. Runs FIRST so the greeting paints immediately. =====
   One shared name for the whole app. Order of trust: typed by the user > link (?name=) > SharePoint / Microsoft 365 > PC user folder > remembered. */
(()=>{'use strict';
const mem={};
const st={
 g:k=>{try{const v=localStorage.getItem(k);if(v!=null)return v}catch(e){}try{const v=sessionStorage.getItem(k);if(v!=null)return v}catch(e){}return mem[k]==null?null:mem[k]},
 s:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}try{sessionStorage.setItem(k,v)}catch(e){}},
 d:k=>{delete mem[k];try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem(k)}catch(e){}}};
const BAD=/^(public|default|user|users|admin|administrator|owner|guest|test|temp|pc|laptop|desktop|home|work|student|agent|root|system|download|downloads|documents|onedrive|unknown|none|null|undefined)$/i;
const cap=n=>(n&&(n===n.toLowerCase()||n===n.toUpperCase()))?n.charAt(0).toUpperCase()+n.slice(1).toLowerCase():n;
function first(n,loose){n=String(n||'').trim();if(!n)return'';if(n.indexOf('|')>-1)n=n.split('|').pop();if(n.indexOf('@')>-1)n=n.split('@')[0].replace(/[._\-]+/g,' ');if(n.indexOf(',')>-1)n=n.split(',')[1]||'';n=n.replace(/\(.*?\)/g,'').trim();if(loose||/^[^\s]+$/.test(n))n=n.replace(/[._\-\d]+/g,' ').trim();n=n.split(/\s+/)[0]||'';n=n.replace(/[^\p{L}'’\-]/gu,'');if(n.length<2||BAD.test(n))return'';return cap(n).slice(0,30)}
/* a name the user typed is trusted as typed (no filtering of words like "Test") */
const clean=v=>String(v||'').replace(/[<>&"]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
const LBL={url:'from the link',sharepoint:'from your Microsoft 365 account',pc:'from your computer user name',saved:'remembered on this device'};
let best={n:'',src:'',r:0};const subs=[];
const mFull=()=>clean(st.g('pb-full')||st.g('pb-first')||'');
const name=()=>{const m=mFull();return m?cap(m.split(' ')[0]):best.n};
const full=()=>mFull()||best.n;
const src=()=>mFull()?'manual':best.src;
function emit(){try{document.title=(name()?name()+' · ':'')+'Performance Booster'}catch(e){}subs.forEach(f=>{try{f()}catch(e){}});try{document.dispatchEvent(new CustomEvent('pbname',{detail:name()}))}catch(e){}}
function offer(n,s,r){n=first(n,s==='pc'||s==='url');if(!n||r<best.r)return;if(r===best.r&&n===best.n)return;best={n,src:s,r};if(s!=='saved')st.s('pb-auto',n+'|'+s);emit()}
/* push a typed name into the other places the app keeps a name (only where empty or still the old auto value) */
function propagate(prev,nw){if(!nw)return;
 ['pb-agent','pb-admname'].forEach(k=>{const cur=st.g(k);if(!cur||cur===prev)st.s(k,nw)});
 try{const raw=localStorage.getItem('pb-simdata');if(raw){const d=JSON.parse(raw);if(d&&typeof d==='object'&&(!d.name||d.name===prev)){d.name=nw.slice(0,60);localStorage.setItem('pb-simdata',JSON.stringify(d))}}}catch(e){}}
window.PBU={name,full,src,label:()=>LBL[best.src]||'',raw:()=>mFull()||best.n,c:()=>name()?', '+name():'',
 set:v=>{const prev=full(),c=clean(v);
  if(c){st.s('pb-full',c);st.s('pb-first',cap(c.split(' ')[0]))}else{st.d('pb-full');st.d('pb-first')}
  propagate(prev,full());emit();return name()},
 greet:()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'},
 on:f=>subs.push(f)};

/* 1. remembered (instant, synchronous) */
try{const m=(st.g('pb-auto')||'').split('|');if(m[0])best={n:first(m[0]),src:'saved',r:1}}catch(e){}
/* 2. PC user folder (file opened from the local disk) */
try{if(location.protocol==='file:'){const p=decodeURIComponent(location.pathname),m=p.match(/\/(?:Users|home)\/([^\/]+)\//i)||p.match(/\/Documents and Settings\/([^\/]+)\//i);if(m)offer(m[1],'pc',2)}}catch(e){}
/* 3. link: ?name=Sara (also user, username, u, agent, who, email, upn; or #name=Sara) */
try{const q=new URLSearchParams(location.search),h=new URLSearchParams((location.hash||'').replace(/^#\/?/,''));
 for(const k of ['name','user','username','u','agent','who','email','upn']){const v=q.get(k)||h.get(k);if(v&&first(v,true)){offer(v,'url',4);break}}}catch(e){}
/* 4. SharePoint / Microsoft 365 account (async, never blocks the greeting) */
try{const c=window._spPageContextInfo;if(c)offer(c.userDisplayName||c.userLoginName||c.userEmail,'sharepoint',3)}catch(e){}
const onSP=/sharepoint\.(com|cn|us)$/i.test(location.hostname)||!!window._spPageContextInfo;
let detectNote='';
let storeOk=true;try{localStorage.setItem('pb-t','1');localStorage.removeItem('pb-t')}catch(e){storeOk=false}
if(onSP){
 /* the person's own web lives under /personal/<x>, /sites/<x> or /teams/<x>: find it from the page address, the ?id= of the viewer link, or the SharePoint context */
 const bases=new Set(['']);
 try{const add=p=>{const m=String(p||'').match(/^\/((?:personal|sites|teams)\/[^\/?#]+)/i);if(m)bases.add('/'+m[1])};
  try{add(decodeURIComponent(location.pathname))}catch(e){add(location.pathname)}
  add(new URLSearchParams(location.search).get('id'));
  const w=window._spPageContextInfo;if(w&&w.webServerRelativeUrl&&w.webServerRelativeUrl!=='/')bases.add(String(w.webServerRelativeUrl).replace(/\/$/,''))}catch(e){}
 const get=u=>{const ctl=typeof AbortController==='function'?new AbortController():null,to=setTimeout(()=>{try{ctl&&ctl.abort()}catch(e){}},2500);

booking and request post-trip receipts to refund any price difference.\n\nIf the vendor was not reachable:\nExplain to the customer that we weren't able to reach the car rental company.\nCancel the original booking.\n\nNotes:\n\nRemember if the price difference refund is $500 or more, we assign an SR for that refund.\n\nAlso, the new booking should be using the same payment type as the cancelled one."}]}, {"name": "Insurance", "levels": ["refundability", "Product", "Intent"], "entries": [{"path": ["Cancel button is working", "Hotel", "Cancel"], "text": "Proceed with the cancellation as it will be free of charge if the button is working"}, {"path": ["Cancel button is working", "Car", "Cancel"], "text": "Proceed with the cancellation as it will be free of charge if the button is working"}, {"path": ["Cancel button is working", "package", "Cancel"], "text": "Proceed with the cancellation as it will be free of charge if the button is working"}, {"path": ["Cancel button is not working", "Hotel", "Cancel"], "text": "For cancelling the insurance on a hotel booking we can only cancel in the following secnarios:\n\n\n\nWithin 15 days of purchase — if the trip hasn’t started and the traveler hasn’t filed a claim. \n\nVoided booking — if the original hotel booking was canceled within the 15-day cool-off period but the insurance was left active. \n\nSame-day hotel booking canceled — if the traveler cancels the same-day hotel booking was made , the travel protection can be refunded. \n\nHotel date change — if a new itinerary number is required and the change is within the 15-day window, cancel and refund the existing insurance. \n\n\n\nImportant: For a non-refundable hotel, do not cancel the insurance just because the hotel is non-refundable. The traveler should keep the insurance and contact the insurance provider to file a claim."}, {"path": ["Cancel button is not working", "Car", "Cancel"], "text": "We can process the refun for the insurance only in following secnarios :                                                                           Pre-trip cancellation — Traveler wants to cancel the car and/or insurance, as long as they haven’t picked up the car.\nChange of booking dates — Cancel the existing booking and rebook; the traveler can add insurance to the new booking.\nEG insurance not honored — The rental company refuses to accept the insurance or tells the traveler to buy different insurance.\nTraveler was charged extra for insurance — Document the issue and refund your insurance.\nNo-show / car not picked up — If the traveler never picked up the car, the insurance can be refunded. This applies up to 24 hours post-trip.\nCar canceled by the supplier — If the supplier cancels because of issues such as car unavailable, wrong car type, price mismatch, location closed, duplicate booking, or pickup timing issues, refund the insurance.\n\nImportant: If the traveler has already picked up the car, the insurance generally should not be refunded, except where the specific policy/process says otherwise."}, {"path": ["Cancel button is not working", "package", "Cancel"], "text": "Within 15 days of purchase — trip hasn’t started and no claim has been filed.\nVoided booking — the original package was canceled within the 15-day cool-off period, but the insurance was not canceled.\nDestination change — the original insurance is not valid for the new destination.\nPackage date change requiring a new itinerary number — the original protection does not cover the new booking."}]}, {"name": "Activity", "levels": ["refundability", "Intent"], "entries": [{"path": ["Direct supplier", "Cancel"], "text": "**Direct Supplier (EG Native) – Cancellation/Refund Process**\n\n1. **Supplier-driven issue:** No waiver approval is needed. Trust the customer and proceed with the refund.\n2. **Refund under $500:** Use the **Credit workflow** and file **Breakage**.\n3. **Refund over $500:** Create a **Refund Over $500 SR**.\n4. **Document the exact supplier-driven reason** in **Voyager Classic → Credit Notes** (e.g., supplier canceled, booking not confirmed, supplier denied service, overbooked, voucher/ticket not honored).\n5. **Do NOT call/email the supplier** or create a waiver SR for a supplier-driven Direct Supplier issue.\n\n**IMPORTANT – Round-trip Shuttle Services:**\nRound-trip Shuttle Services (e.g., **Airport → Hotel → Airport** or vice versa) are **excluded from auto approval**. Follow the regular process by **contacting the supplier to obtain a partial refund**.\n**If a full refund is processed on a round-trip shuttle, this will be considered an AGENT ERROR.**                                        If NOT supplier-driven:\n\nRefundable / within cancellation policy: Cancel normally in BSA → customer receives the applicable refund.\nNon-refundable / cancellation deadline passed: Reinforce the non-refundable policy. Do not call/email the supplier for a waiver and do not create a VNA case.\nChanges: Activity changes are not allowed → cancel and rebook using BSA."}, {"path": ["Direct supplier", "Change"], "text": "Activity changes are NOT allowed.\nCancel the current activity and rebook a new one using BSA.\nDo not call the supplier or send an email to request a change."}, {"path": ["Direct supplier", "Activity closed"], "text": "If you mean the activity is closed / partner is closed for a Direct Supplier, the process is:\n\nWithin the cancellation policy: Cancel the booking and email Activities Help for investigation.\nOutside the cancellation policy: Attempt to contact the supplier for refund approval and check the activity status.\nIf the supplier does not respond: Create a Refund Over $500 SR and email Activities Help.\nIf the supplier confirms the closure: Follow the refund action based on their response"}, {"path": ["Third party", "Cancel"], "text": "For Third-Party Supplier – Frontline (Viator / GYG)Article number1333:\n\nCancel – Refundable\nUse the Cancel button.\nIf Cancel is greyed out but the customer qualifies for a refund → process the Credit.\nReason: Site error / Agent Tool Refund Error\nNotify the appropriate 3P partner manually to accept the cancellation.\nYou can offer to book another activity.\nCancel – Non-refundable\nDo NOT call the activity provider.\nSend an email to the appropriate 3P partner to request cancellation/refund approval.\n3P email approval is required, even if the activity provider says they approved it.\n\nQuick rule:\nRefundable → Cancel/credit.\nNon-refundable → Email the 3P partner; don't call."}, {"path": ["Third party", "Change"], "text": "Activity changes are NOT allowed.\nCancel the current activity and rebook a new one using BSA.\nDo not call the supplier or send an email to request a change."}, {"path": ["Third party", "Activity closed"], "text": "For Third-Party Supplier – Frontline (Viator / GYG) when the activity is closed:\n\nDo NOT call the supplier.\nIdentify the 3P provider from the supplier reference:\nBR → Viator\nGYG → GetYourGuide\nSend an email to the appropriate 3P partner to request refund approval. Never email both providers.\nTell the customer that we need to email the activity provider to seek approval.\n\nQuick rule:\nActivity closed + 3P → Email the correct 3P partner, don’t call.\n3P email approval is required before processing the refund."}, {"path": ["Special agreement", "Cancel"], "text": "For a Special Agreement activity cancellation, the frontline process is:\n\nDo not contact the activity provider directly.\n\nTell the customer the activity is non-refundable and that you’ll submit a cancellation/refund request by email.\n\nFrom Voyager Next, email activitieshelp@expediagroup.com using the “Cancel and refund special agreement activity” template.\n\nTell the customer they should receive an email response within 5 days.\n\nPartner Support should generally only be contacted for extenuating circumstances, such as a flex policy, force majeure, hospitalization, death of a family member/friend, or Gold status.\n\nException: Disneyland California: bookings made before July 10, 2025 may still have a cancellation entitlement; send the request to the Activities Help Desk for processing."}, {"path": ["Special agreement", "Change"], "text": "Activity changes are NOT allowed.\nCancel the current activity and rebook a new one using BSA.\nDo not call the supplier or send an email to request a change."}, {"path": ["Special agreement", "Activity closed"], "text": "If the Special Agreement activity provider is permanently closed:\n\nTell the customer you’ll submit the refund request by email.\n\nEmail activitieshelp@expediagroup.com using the “Cancel and refund special agreement activity” template.\n\nTell the customer they should receive a response within 5 days.\n\nDo not contact the special-agreement supplier directly."}]}, {"name": "Loyalty(Onekeycash+Gift cards)", "levels": ["Intent"], "entries": [{"path": ["Earn and benfits"], "text": "Trip Elements\nCountable travel components: flights, hotel/car/vacation-rental/cruise nights, transfers, and activities.\n\nEach qualifying component counts as a trip element; qualification depends on the POSa minimum spend.\n\nOneKeyCash-redemption portions can still earn trip elements if the booking meets the threshold.\n\nTier Status\nTrip elements earned Jan 1–Dec 31 determine the next year's tier.\n\nBlue: 0 | Silver: 5 | Gold: 15 | Platinum: 30 trip elements.\n\nReaching a new tier early gives immediate status through the following full year.\n\nEarn Rates\nBase US POSa earn rates: Blue 1%, Silver/Gold 2%, Platinum 3% on eligible spend.\n\nVIP Access rates: Silver 3%, Gold 4%, Platinum 6%.\n\nRates can vary by POSa and brand; taxes/fees are excluded.\n\nTier Benefits\nHigher tiers provide increased Member Prices, VIP Access benefits, and higher OneKeyCash earnings.\n\nBenefits can include room upgrades, food/beverage perks, Price Tracking, and Price Drop Protection.\n\nGold/Platinum also receive priority support; Platinum has VIP Support.\n\nEarn Confirmation Timelines\nActivities, packages, Pay Now hotels/cars: up to 3 days after completion.\n\nFlights: up to 10 days; Pay Later hotel/Vrbo: up to 35 days.\n\nCruises: up to 45 days; Pay Later car: up to 90 days.\n\nIneligible for Rewards\nExamples: bookings before joining One Key, guest bookings, taxes/fees, insurance, coupons, gift cards, group rates, and direct airline bookings.\n\nUS POSa flight bookings are currently ineligible.\n\nTAAP agent-account bookings don't earn rewards, but personal One Key accounts can.\n\nMissing OneKeyCash or Trip Elements\nFirst verify that the booking is eligible and the confirmation timeframe has passed.\n\nIf eligible rewards are missing, manually adjust OneKeyCash/trip elements.\n\nUse the applicable Loyalty | One Key | Adjust OneKeyCash and trip elements process.\n\nVIP Access Earnings\nVIP Access properties provide higher OneKeyCash rates for Silver, Gold, and Platinum.\n\nSilver 3% | Gold 4% | Platinum 6% for the US POSa.\n\nRates may differ by POSa/brand.\n\nMobile App Bookings\nThere is no additional OneKeyCash just for booking through the mobile app.\n\nPrevious Expedia Rewards mobile promotions don't apply to One Key.\n\nFuture promotional offers may provide additional rewards.\n\nRedemption Bookings\nTravelers can earn trip elements on redemption bookings.\n\nThe booking portion must meet the applicable POSa qualification amount.\n\nOneKeyCash used for payment does not itself earn OneKeyCash.\n\nTAAP Agents\nTAAP agents do not earn One Key rewards on their agent account.\n\nThey may have a separate personal One Key account.\n\nPersonal accounts must only be used for personal travel.\n\nRounding Differences\nOneKeyCash shown during booking may differ slightly from the confirmation email.\n\nThis can happen because of local-currency conversion and rounding.\n\nThe confirmation email/Rewards Activity amount is the final amount.\n\nTier Status Not Updated\nCheck whether the completed booking qualifies and whether its confirmation period has passed.\n\nIf eligible but the tier hasn't updated, manually adjust the rewards/trip elements.\n\nFollow Loyalty | One Key | Adjust OneKeyCash and trip elements.\n\nNon-One Key POSa\nOne Key is only available in participating brands/regions.\n\nIf the traveler moves to a non-One Key POSa, the applicable legacy rewards program may apply.\n\nExample: Expedia Rewards or Hotels.com Rewards, depending on the brand/POSa.\n\nHotels.com Rewards\nIn regions where One Key replaced Hotels.com Rewards, travelers can't continue earning stamps/reward nights.\n\nExisting stamps/reward nights were converted to OneKeyCash.\n\nOne Key allows rewards across participating Expedia brands and multiple travel products.\n\nOneKeyCash Expiration\nEarned OneKeyCash generally doesn't expire if the traveler makes an eligible booking or redemption at least once every 18 months.\n\nPromotional OneKeyCash may have a shorter expiration period.\n\nAlways check the specific promotion terms.\n\nCurrency Conversion\nOneKeyCash can display in the local POSa currency when booking internationally.\n\nThe balance is converted using the exchange rate applicable on the booking date.\n\nRewards Activity shows the current balance and transaction details in account/local currencies.\n\nChanged Account Currency\nIf the traveler says their One Key account currency changed automatically, follow the Loyalty | One Key | Join and manage account process.\n\nCheck the “Good to Know” section for currency-management information.\n\nDon't assume the displayed local currency means their actual rewards balance changed."}, {"path": ["Calculate of onekey cash earned"], "text": "Policy / POSa\nCalculations shown apply to US and UK POSa; rates can vary by brand and POSa.\n\nBase price excludes taxes, fees, OneKeyCash, and coupons.\n\nCruises are eligible only on US and Canada POSa.\n\nHotels, Expedia Vacation Rentals, Activities, Cars & Cruises\nBlue 1% | Silver/Gold 2% | Platinum 3%.\n\nExample: $150 base price → Blue $1.50, Silver/Gold $3, Platinum $4.50.\n\nTrip elements are earned separately when the booking qualifies.\n\nVrbo Vacation Rentals\nBlue 0% | Silver 1% | Gold/Platinum 2%.\n\nExample: $150 base price → Silver $1.50, Gold/Platinum $3.\n\nBlue members don't earn OneKeyCash on these bookings.\n\nVIP Access Properties\nBlue 2% | Silver 3% | Gold 4% | Platinum 6%.\n\nExample: $150 base price → $3 / $4.50 / $6 / $9 respectively.\n\nThese higher rates apply specifically to VIP Access properties.\n\nCalculation Formula\nOneKeyCash = Base price × applicable earn rate.\n\nExample: $150 × 4% = $6 OneKeyCash.\n\nExclude taxes, fees, OneKeyCash, and coupon-paid amounts.\n\nExample: 3-Night VIP Access Hotel\n$150 total base price earns 3 trip elements because each night counts separately.\n\nOneKeyCash: Blue $3 | Silver $4.50 | Gold $6 | Platinum $9.\n\nTrip elements and OneKeyCash are calculated independently."}, {"path": ["Onekeycash redemption process"], "text": "Redeem OneKeyCash Online\nTravelers can redeem OneKeyCash themselves during checkout on participating brands.\n\nOn the payment screen, eligible bookings will show the option to apply OneKeyCash.\n\nEncourage self-service through the website or mobile app.\n\nRedeem Through an Agent\nLodging: Book in Voyager Classic, deduct the requested OneKeyCash in Voyager Next, then refund the equivalent amount in Voyager Classic.\n\nNon-lodging: Use BSA to book and apply OneKeyCash.\n\nUse the One Key adjustment process if help is needed.\n\nAutomatic OneKeyCash Redemption\nExpedia & Vrbo: OneKeyCash is automatically applied; traveler must turn it off if unwanted.\n\nHotels.com: OneKeyCash is not automatic; traveler must turn it on.\n\nExpedia: Traveler can adjust how much OneKeyCash to redeem.\n\nChanges to Redemption Bookings\nPenalty-free change to a cheaper booking → OneKeyCash is automatically refunded.\n\nMore expensive change → original OneKeyCash carries over; card pays the difference.\n\nAdditional OneKeyCash cannot cover the difference; cancel/rebook if needed.\n\nRefunds\nUsing the Refund button → OneKeyCash is automatically returned.\n\nOneKeyCash refunds/adjustments may take up to 72 hours to appear in Rewards Activity.\n\nCredit Button\nUsing Credit does not automatically return OneKeyCash.\n\nManually return the OneKeyCash using the One Key adjustment process.\n\nCancellations\nPenalty-free cancellation: OneKeyCash automatically returns.\n\nCancellation with penalty: OneKeyCash is not returned.\n\nIf the penalty is waived, OneKeyCash is automatically returned.\n\nPartial-Penalty Refund\nIf canceled within a penalty window, used OneKeyCash is not returned and no rewards are earned.\n\nIf the penalty is waived, OneKeyCash is automatically returned.\n\nForgot to Use OneKeyCash\nOneKeyCash cannot be added to an existing booking by changing the payment method.\n\nIf the booking is penalty-free, the traveler can cancel and rebook using OneKeyCash.\n\nRewards After Cancellation/Change\nCanceled portions don't earn rewards.\n\nOneKeyCash and trip elements are adjusted based on the final booking.\n\nTrip elements generally don't need manual adjustment for redemption-booking changes.\n\nOneKeyCash Adjustment Not Showing\nAdjustments are generally immediate but may take up to 24 hours to appear.\n\nCheck the Brand Site to confirm the adjustment was completed."}, {"path": ["Redmption rules"], "text": "General Redemption Rules\nBooking must be Pay Now and show the option to use OneKeyCash.\n\nOneKeyCash is not earned on the portion paid with OneKeyCash.\n\nIf OneKeyCash doesn't cover the full amount, the remaining balance must be paid by credit/debit card.\n\nHotels\nOneKeyCash can pay for Pay Now hotels + insurance.\n\nAvailability depends on the booking showing the redemption option.\n\nTaxes/fees may be covered depending on brand and POSa.\n\nVrbo\nOneKeyCash can pay for eligible Vrbo bookings.\n\nFor installment bookings, it can only be used toward the first payment.\n\nRedemption is not available on IPM bookings.\n\nCars\nOneKeyCash can pay for Pay Now standalone car rentals or Car + Insurance.\n\nThe booking must offer the OneKeyCash redemption option.\n\nRemaining balance must be paid by credit/debit card.\n\nActivities\nOneKeyCash can be used for Pay Now activities.\n\nThe booking must be eligible and display the redemption option.\n\nOneKeyCash isn't earned on the portion paid with OneKeyCash.\n\nPackages\nOneKeyCash can be used on select Pay Now packages.\n\nExpedia must be the Merchant of Record (MoR) for at least one component.\n\nMaximum redemption is limited to the value of the package components where Expedia is the MoR.\n\nTaxes & Fees\nOneKeyCash may cover taxes and fees for some brands/POSa.\n\nAlways check the POSa-specific policy.\n\nIf the redemption option isn't displayed, the booking isn't eligible.\n\nPayment Methods\nIf OneKeyCash doesn't cover the full booking, the remainder must be paid by credit/debit card.\n\nPayPal, Google Pay, Klarna, Cash App, Affirm, and Afterpay cannot be used for the remaining balance.\n\nPrice Drop Protection\nTravelers can use OneKeyCash to purchase Price Drop Protection when the flight redemption is eligible.\n\nEligibility depends on factors such as sufficient OneKeyCash and the airline.\n\nThis is separate from using OneKeyCash for the flight itself.\n\nOneKeyCash + Coupons\nExpedia: Promotional coupons and OneKeyCash can be used together.\n\nOneKeyCash is earned only on the amount paid by card and not covered by OneKeyCash/coupon.\n\nHotels.com and Vrbo: Promotional coupons and OneKeyCash cannot be combined."}, {"path": ["Legacy conversion"], "text": "One Key Migration\nOnly eligible activity from participating brands/POSa counts toward One Key tier status.\n\nFor Expedia POSa outside US/UK that joined in 2025, the higher of eligible 2024 activity vs. 2025 activity before joining determined the starting tier.\n\nIf no eligible activity exists, the traveler starts at Blue.\n\nMigration Tier Duration\nFor Expedia travelers who migrated in 2025, the assigned tier remains active through February 28, 2027.\n\nMatching email addresses are required when combining activity from multiple participating brands/POSa.\n\nPreviously manually awarded tier status is retained at minimum.\n\nExpedia Rewards Points Conversion\n100 Expedia Rewards points = $1 OneKeyCash with no loss of value.\n\nExample: 1,250 points = $12.50 OneKeyCash.\n\nThe original points expiration date is retained, subject to the migration rules.\n\nHotels.com Reward Nights\nApplies to US and UK.\n\nReward nights were converted to OneKeyCash at their full value.\n\nExample: a $125 reward night = $125 OneKeyCash.\n\nHotels.com Reward Stamps\nApplies to US and UK.\n\nEach stamp was converted at 10% of its value, because 10 stamps previously earned a reward night.\n\nExample: a $125 stamp = $12.50 OneKeyCash.\n\nHotels.com Expiration\nConverted stamps/reward nights retain their original expiration date.\n\nHotels.com Rewards generally expired 12 months after the last eligible activity.\n\nIf converted Expedia points had a later expiration date, the later date could apply.\n\nVrbo Migration\nVrbo had no previous loyalty program, so there were no legacy rewards to convert.\n\nTravelers began earning OneKeyCash on eligible bookings after joining One Key.\n\nThis applies across Vrbo and heritage-brand markets.\n\nPending Rewards During Migration\nUS/UK: Eligible bookings completed after joining One Key earn at One Key rates.\n\nOutside US/UK: Pre-One-Key bookings generally retain the legacy rate, even if completed after joining.\n\nChanges made after One Key launches can cause the booking to earn under the new One Key rate.\n\nTraveler Says Rewards Were Migrated Incorrectly\nCheck the traveler's Voyager Next loyalty section for converted OneKeyCash.\n\nIf a specific booking/reward is missing, follow the legacy rewards conversion error process.\n\nFor a full migration reconciliation, Tier 3 can email Rewards Support using the Rewards Migration Research template.\n\nGuest Bookings / Missing Legacy Rewards\nMigration only included rewards attached to the traveler's account.\n\nGuest-account bookings were not included automatically.\n\nFollow the Research legacy rewards conversion errors process for these cases.\n\nOne Key Not Available on Another POSa\nExpedia: Accounts are POSa-specific; rewards remain on a POSa until One Key launches there.\n\nHotels.com: Rewards accounts are global, but conversion depends on the account's Preferred POSa.\n\nTravelers can continue using the applicable legacy rewards program where One Key hasn't launched."}, {"path": ["Promotional onekeycash"], "text": "Travel-Earned OneKeyCash\nExpires after 18 months.\n\nPromotional OneKeyCash\nExpires on the date stated in the promotion.\n\nExpires at 11:59 PM PST.\n\nCheck Promotional Balance\nOneDesk: Traveler Account → Loyalty.\n\nVoyager Next: History → Loyalty.\n\nCheck Rewards Activity for specific promotion details.\n\nMissing Promotional Reward\nConfirm the promotion and whether it was claimed/gifted.\n\nIf confirmed missing, manually award the promotional OneKeyCash.\n\nExpired Promotional Reward\nConfirm “Expired Promotional OKC” in Loyalty History.\n\nYou may reinstate the same amount once as a gift.\n\nReason: Other; note: Reinstating Expired Promotional OneKeyCash.\n\nCancellation\nPromotional OneKeyCash is returned after cancellation.\n\nOriginal expiration date remains unchanged.\n\nUsing OneKeyCash\nThe system uses the balance expiring soonest first.\n\nPartial use does not extend the remaining balance's expiration.\n\nImportant\nPromotional OneKeyCash does not extend the 18-month expiration of travel-earned OneKeyCash."}, {"path": ["VIP Access"], "text": "VIP Access\nVIP Access = selected hotels with high quality and service standards.\n\nLook for the VIP1 icon on the website/Voyager.\n\nAgent Tools may not show VIP status.\n\nVIP Benefits\nSilver, Gold & Platinum can receive perks such as Wi-Fi and breakfast.\n\nGold & Platinum: room upgrades, early check-in, and late checkout when available.\n\nExact perks vary by hotel and are shown in the itinerary/confirmation.\n\nExclusive Gold/Platinum Perk\nIf the traveler doesn't receive the listed perk, apologize and provide the applicable compensation.\n\nOne Key POSa: compensation = OneKeyCash.\n\nNon-One Key POSa: compensation = coupon.\n\nReport Missing Perk\nEmail VIP_perk@expediagroup.com internally with itinerary, hotel, traveler, issue, and compensation provided.\n\nDo not give the email address to the traveler.\n\nRoom Upgrade\nUpgrade is subject to availability.\n\nBefore arrival: traveler can request it at check-in; agents can also contact the hotel.\n\nIf unavailable, ask whether a better-location room is available.\n\nVIP Cancellation\nIf a VIP booking is canceled, the traveler must rebook with Expedia Group to receive VIP perks again.\n\nVIP perks do not automatically transfer to a new booking."}, {"path": ["Trip elemnts adjusment"], "text": "Before Adjusting\nResearch first and confirm the booking is eligible.\n\nAdjust rewards only after travel is completed.\n\nDon't submit a second adjustment until you've checked Voyager Next, OneDesk, and BSA and refreshed.\n\nAdjustment Limits\nOver your tool limit → use the appropriate adjustment-limit email template.\n\nPremium/Tier 3 can make multiple transactions, but the total must not exceed $1,000.\n\nDon't transfer a case just because one transaction exceeds the limit.\n\nOneDesk Process\nLoyalty → Adjust loyalty → select case.\n\nChoose adjustment type, reward type, add/deduct, reason, amount, and notes.\n\nComplete the adjustment and refresh Loyalty History to verify.\n\nVoyager Next Process\nVirtual Agent → Manage Rewards → Adjust Rewards.\n\nChoose add/deduct, reason, amount, cause, and notes.\n\nComplete and refresh Loyalty History to verify.\n\nAccount-Level Adjustment\nUse when rewards need to be added directly to the traveler's account, such as:\n\nGuest booking with missing rewards.\n\nCanceled booking where rewards need to be issued.\n\nBooking missing from the carousel but found in Voyager Classic.\n\nRewards still missing after the confirmation period.\n\nEligible cruise rewards.\n\nBooking fully paid with OneKeyCash.\n\nTool error prevents issuing rewards to the booking.\n\nImportant\nAccount-level OneKeyCash adjustments must use the traveler's rewards account currency.\n\nAccount-level adjustments post immediately.\n\nBooking-level adjustments may remain pending until the earn confirmation timeframe."}, {"path": ["Gift cards"], "text": "Basic Rules\nAvailable in US, CA, UK, SE, AU; customers can use them online only, not by phone.\n\nValid for Pay Now hotel bookings only; not packages or car rentals. No gift-card usage fees.\n\nCan combine with another payment method and eligible bookings can earn Hotels.com Rewards.\n\nGift cards can be transferred to another customer and used immediately; no need to notify us.\n\nCannot be reloaded, replaced if lost/stolen/damaged, or returned.\n\nGift Card Values & Expiration\nUS/CA: $10–$2,000 USD/CAD; no expiration, but deactivate after 3 years while retaining the full value.\n\nUK: £10–£1,350; expires 3 years after activation.\n\nSE: 90–14,500 SEK; expires 3 years after activation.\n\nAU: $10–$2,500 AUD; expires 3 years after activation.\n\nUp to 5 cards can be merged for US, CA, UK, SE; AU cannot be merged.\n\nBalance / Merge\nCustomers can check balances or request eligible card merges through the Hotels.com gift-card service.\n\nGift cards can come from Hotels.com websites, B2B distributors, rewards/incentive programs, banks, and retail stores.\n\nE-gift cards are generally delivered within 1 hour; US/CA physical cards generally take 7–10 days.\n\nHow Customers Redeem\nWebsite/app → choose an eligible Pay Now hotel → select Gift Card as payment → enter card number + PIN.\n\nWebsite search can use the Pay with Hotels.com gift card filter.\n\nPay Later bookings do not offer gift-card payment.\n\nIf the Gift Card option is unavailable, customer must select another hotel.\n\nAgents should encourage self-service; if needed, send an event-driven email with reservation details or guide the customer through the online process.\n\nChanging / Canceling a Gift-Card Booking\nRefund goes automatically to a new gift card.\n\nIf gift card + another payment method was used, the gift-card portion returns to a new gift card and the remaining refund goes to the other payment method.\n\nNew gift card is normally emailed within 4 hours.\n\nCustomer cannot rebook using the refunded amount until they receive the new gift-card email.\n\nWrong Customer Email\nVerify the email address.\n\nIf incorrect, email giftcards@hotels.com with:\n\nCustomer name\n\nEmail used for booking\n\nCorrect email\n\nItinerary number\n\nCancellation date\n\nOriginal gift-card number\n\nGift-card value/currency\n\nIssue description\n\nCustomer Didn't Receive New Gift Card\nCheck Voyager → Billing History.\n\nIf refund shows successful, follow the gift-card FAQ/support process.\n\nIf refund is pending/failed, do not refund the original card or another payment method.\n\nEmail giftcards@hotels.com with customer name/email, itinerary, cancellation date, original card number, value/currency, and issue description.\n\nFailed Gift-Card Refund\nNever attempt another payment-method refund.\n\nEmail giftcards@hotels.com with the complete case details.\n\nTell the traveler the request has been forwarded to the gift-card team and should be resolved within 72 hours.\n\nIf they ask to be transferred, explain the team is offline and unavailable for live assistance.\n\nCommon Gift-Card Issues\nCheckout error: Possible causes include incorrect card/PIN attempts or site issues. Customer can contact the gift-card team or the number on the back of the card.\n\nHotels.com/GiftCard purchase/resend/receipt: Contact the applicable gift-card support number and function ccOk(n){const d=n.replace(/\D/g,''),L=d.length;if(L<12||L>19)return false;let s=0,a=false;for(let i=L-1;i>=0;i--){let x=+d[i];if(a){x*=2;if(x>9)x-=9}s+=x;a=!a}if(s%10)return false;if(d[0]==='1')return L===15;return /^(4|5|6|3|2[2-7]|8[12]|8600|9792|9860)/.test(d)}

function ibanOk(s){const v=s.replace(/\s/g,'').toUpperCase();if(v.length<15||v.length>34)return false;const r=(v.slice(4)+v.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);let m=0;for(const ch of r)m=(m*10+ +ch)%97;return m===1}

 o=o.replace(/(^|\D)(\d(?:[ -]?\d){11,18})(?!\d)/g,(x,p,n)=>ccOk(n)?(hit.add('credit card number'),p+M(n)):x);
 o=o.replace(/\b(cvv2?|cvc2?|cid|security code)(\D{0,12}?)(\d{3,4})\b/gi,(x,k,g,d)=>(hit.add('security code'),k+g+M(d)));
 o=o.replace(/\b(password|passwd|pwd|passcode)(\s*(?::|=|is)\s*)(\S+)/gi,(x,k,g,v)=>(hit.add('password'),k+g+v.replace(/\S/g,'*')));
 o=o.replace(/\b(pin)(\s*(?::|=|is)?\s*)(\d{4,8})\b/gi,(x,k,g,v)=>(hit.add('PIN'),k+g+M(v)));
 o=o.replace(/\b(passport(?:\s*(?:no\.?|number|#))?\s*[:=#-]?\s*)([A-Z0-9]{6,9})\b/gi,(x,k,v)=>/\d/.test(v)?(hit.add('passport number'),k+M(v)):x);
 o=o.replace(/\b\d{3}-\d{2}-\d{4}\b/g,x=>(hit.add('SSN'),M(x)));

const wcZone=z=>z==='auto'?nowTZ():z;
const wcLabel=z=>z==='Etc/GMT+8'?'PST (UTC−8)':z==='auto'?'📍 Auto-detect ('+nowTZ()+')':z.replace(/_/g,' ');
const wcAbbr=z=>{if(z==='Etc/GMT+8')return 'PST';try{return new Intl.DateTimeFormat('en-US',{timeZone:wcZone(z),timeZoneName:'short'}).formatToParts(new Date()).find(x=>x.type==='timeZoneName').value}catch(e){return ''}};

 els.forEach(e=>{const z=WC[+e.dataset.wct];if(!z)return;const tz=wcZone(z),d=new Date();
  e.querySelector('[data-w="t"]').textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!WC24}).format(d);

 box.onchange=e=>{const s=e.target.closest('[data-wc="sel"]');if(s){WC[+s.dataset.i]=s.value;wcSave();wcTick()}};

function fcAll(){const c=[];P.forEach(p=>p.entries.forEach(e=>c.push({t:'p',cat:short(p.name),q:p.levels.map((l,i)=>l+': '+e.path[i]).join('  ·  '),a:e.text})));

function fcHtml(){return '<div data-r="fc"></div>'}
function initFC(root){
 const box=root.querySelector('[data-r="fc"]'),all=fcAll(),cats=['All',...new Set(all.map(c=>c.cat))];
 let cat='All',len='10',g=null,best=+ST.get('pb-fcb')||0;
 const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
 const cl=t=>{t=t.replace(/\s+/g,' ').trim();return t.length>240?t.slice(0,237).trim()+'…':t};
 const build=c=>{const k={...c};
  if(c.t==='o'){k.o=[5,10,15].map(p=>({x:p+'%',ok:p===c.pct}));return k}
  const seen=new Set([cl(c.a)]),d=[],pp=all.filter(x=>x.t==='p');
  for(const x of [...shuf(pp.filter(x=>x.cat===c.cat)),...shuf(pp.filter(x=>x.cat!==c.cat))]){if(d.length>=3)break;const s=cl(x.a);if(!seen.has(s)){seen.add(s);d.push(x.a)}}
  k.o=shuf([{x:cl(c.a),ok:true},...d.map(a=>({x:cl(a),ok:false}))]);return k};
 const pool=()=>all.filter(c=>cat==='All'||c.cat===cat);
 const menu=()=>{g=null;box.innerHTML='<div class="card"><div class="lbl">🃏 Practice your knowledge</div><div class="mu" style="margin-top:6px"><b>'+all.length+'</b> multiple-choice scenarios from the processes and OKC percentages in this app. Answer every question — the correct answers and your score appear at the end of the round. Best score: <b>'+best+'</b></div><div class="lbl">Topic</div><div class="fld"><select data-fc="cat">'+cats.map(c=>'<option value="'+esc(c)+'"'+(c===cat?' selected':'')+'>'+esc(c)+' ('+all.filter(x=>c==='All'||x.cat===c).length+')</option>').join('')+'</select></div><div class="lbl">Questions per round</div><div class="fld"><select data-fc="len">'+['5','10','20','all'].map(v=>'<option value="'+v+'"'+(v===len?' selected':'')+'>'+(v==='all'?'All questions in topic':v+' questions')+'</option>').join('')+'</select></div><button class="chip on" data-fc="start" style="width:100%;justify-content:center;font-weight:700" type="button">▶️ Start round</button></div>'};
 const start=d=>{g={d:d.map(build),i:0,a:[]};draw()};
 const draw=()=>{if(g.i>=g.d.length)return end();const c=g.d[g.i],n=g.d.length,pct=Math.round(g.i/n*100);
  box.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">'+icon(c.cat==='OKC %'?'x':c.cat)+' '+esc(c.cat)+'</span><b>Question '+(g.i+1)+' / '+n+'</b></div><div style="height:6px;border-radius:6px;background:var(--bd);margin:10px 0"><div style="height:100%;width:'+pct+'%;border-radius:6px;background:linear-gradient(135deg,var(--ac),var(--ac2))"></div></div>'+
  (c.t==='p'?'<div class="lbl">Scenario</div><div class="fc-q">'+esc(c.q)+'</div><div class="mu">Which is the correct process?</div>':'<div class="lbl">'+esc(c.g)+'</div><div class="fc-q">Customer reports: “'+esc(c.q)+'”</div><div class="mu">What OKC compensation percentage applies?</div>')+
  '<div class="fc-o" style="margin-top:12px;'+(c.t==='p'?'flex-direction:column':'')+'">'+c.o.map((o,i)=>'<button class="chip" data-fc="pick" data-v="'+i+'" type="button" style="'+(c.t==='p'?'text-align:left;font-size:13px;font-weight:500;width:100%':'')+'">'+(c.t==='p'?'<b>'+'ABCD'[i]+'.</b> ':'')+esc(o.x)+'</button>').join('')+'</div></div><button class="chip" data-fc="menu" type="button">✕ Quit round</button>'};
 const end=()=>{const n=g.d.length,r=g.d.filter((c,i)=>c.o[g.a[i]].ok).length,s=r*10,pc=Math.round(r/n*100),miss=g.d.filter((c,i)=>!c.o[g.a[i]].ok);g.miss=miss;if(s>best){best=s;ST.set('pb-fcb',String(best))}try{bdPractice(n&&pc>=90?[BDG.ace]:[])}catch(e){}
  box.innerHTML='<div class="card res"><div class="lbl">🏁 Round complete</div><div class="clk">'+s+' / '+n*10+' pts</div><div class="mu">'+r+' of '+n+' correct · '+pc+'% · Best: '+best+'</div><div class="txt"><b>'+(pc>=90?'🏆 Outstanding — you know your processes!':pc>=70?'👏 Great job, almost there.':pc>=50?'👍 Good start, keep practicing.':'📚 Review the answers below and try again.')+'</b></div><div class="row" style="margin-top:12px"><button class="chip on" data-fc="menu" type="button">🔁 New round</button>'+(miss.length?'<button class="chip" data-fc="retry" type="button">🎯 Retry missed ('+miss.length+')</button>':'')+'</div></div><div class="lbl">Answers review</div>'+
  g.d.map((c,i)=>{const ok=c.o[g.a[i]].ok,right=c.o.find(o=>o.ok);return '<div class="card" style="border-left:4px solid '+(ok?'#0b8a55':'#e03131')+'"><b>'+(ok?'✅':'❌')+' '+(i+1)+'. '+esc(c.t==='o'?'“'+c.q+'” — OKC %':c.cat+' · '+c.q)+'</b>'+(ok?'':'<div class="mu" style="margin-top:6px">Your answer: '+esc(c.o[g.a[i]].x)+'</div>')+(c.t==='o'?'<div class="txt" style="margin-top:6px">Correct: <b>'+esc(right.x)+'</b></div>':ok?'':'<div class="fc-a txt">'+fmt(c.a)+'</div>')+'</div>'}).join('')};
 box.onchange=e=>{const k=e.target.dataset.fc;if(k==='cat')cat=e.target.value;else if(k==='len')len=e.target.value};
 box.onclick=e=>{const b=e.target.closest('button[data-fc]');if(!b)return;const k=b.dataset.fc;
  if(k==='start'){const p=shuf(pool());start(len==='all'?p:p.slice(0,+len))}
  else if(k==='pick'){g.a[g.i]=+b.dataset.v;g.i++;draw()}
  else if(k==='retry')start(shuf(g.miss));
  else if(k==='menu')menu()};
 menu()}

 add({cat:'Navigation',ico:'📢',t:'Announcements',sel:'.an-btn',an:1,d:'Top-right. Team announcements live here.',f:['A <b>red dot</b> means something is waiting for you, and a chime plays when a new one arrives.','Enter <b>your name</b> and press <b>✓ I acknowledge</b>; then you can <b>🙈 Dismiss</b> it.','<b>⬇️</b> imports an announcement from a share code someone sent you.','Press <b>✕</b> to close the panel.'],run:()=>{const p=document.querySelector('.an-panel');if(p&&!p.classList.contains('open')){quiet++;try{document.querySelector('.an-btn').click()}finally{quiet--}}}});

 add({cat:'Finding answers',ico:'⭐',t:'Favorites and Recent',d:'Shortcuts appear above the options on every product tab.',f:['<b>⭐ Favorites</b>: every process you saved.','<b>🕒 Recent</b>: your last 5 viewed processes.','Tap any chip to jump straight back.']});
 add({cat:'Personalize',ico:'🎨',t:'Look and feel',sel:'.ctl',d:'Top of the page, next to the title.',f:['<b>Colored dots</b> change the accent color (blue, violet, emerald, sunset, yellow).','<b>Background button</b> cycles through scenes (city, beach, mountains…) and an off setting.','<b>🌙 / ☀️</b> switches dark and light mode.','All saved for next time.']});
 add({cat:'Personalize',ico:'🔔',t:'Sound',sel:'#pbSnd',d:'Bottom-right corner.',f:['<b>🔔 Sound on / 🔕 Muted</b> controls <b>all</b> sounds.','Timer and break <b>beeps</b>, announcement <b>chimes</b>, plus new <b>click sounds</b> and <b>celebrations</b>.','Sounds stay quiet until you tap the page once (a browser rule).']});
 add({cat:'Tool windows',ico:'🪟',t:'How tool windows work',d:'Every tool opens in its own floating window:',f:['<b>Drag</b> the title bar to move it anywhere.','<b>—</b> minimizes it to a chip in the bottom-left <b>dock</b>; tap the chip to bring it back.','<b>✕</b> closes it.','Open <b>several at once</b>; tap a window to bring it to the front.','Timers and clocks keep running while a window is minimized.']});
 tools.filter(t=>String(t[2]).startsWith('tool:')).forEach(t=>{const id=String(t[2]).slice(5),td=TD[id];let em='';try{em=EMT.map(x=>x.name.replace(/^\S+\s/,'')).join(' / ')}catch(e){}
  add({cat:'Tool',ico:t[0],t:t[1],tool:id,d:td?td[0]:'Open it from the Tools panel.',f:td?td[1].map(x=>x.replace('%EM%',E(em))):['Open it from the ☰ Tools panel.']})});
 let bd='';try{bd=Object.values(BDG)}catch(e){bd=[]}

 add({cat:'Safety',ico:'🛡️',t:'Sensitive-data guard',d:'The app protects customers (and you).',f:['Credit card numbers, <b>CVV</b>, passwords, <b>PINs</b>, passports, <b>SSNs</b> and <b>IBANs</b> are replaced with * when typed or copied.','Works in fill-in boxes, Notes, email templates and copied text.','A red notice tells you when something was hidden.','Emails and phone numbers are not affected.']});
 add({cat:'Fun',ico:'🎉',t:'Little extras',d:'Because work can be fun too.',f:['Every button has its own <b>sound and sparkle</b>: tabs, copy, favorites, themes, timers.','<b>Correct answers</b> ding, wrong ones buzz, and <b>perfect scores</b> trigger confetti.','Try tapping the <b>title</b> or <b>Expedia logo 5 times</b> quickly. 😉','Sounds and effects respect the 🔔 switch and your device’s reduced-motion setting.']});
 add({cat:'Done',ico:'🚀',t:'You’re all set'+(window.PBU?PBU.c():'')+'!',d:'You’ve seen every feature. Reopen this guide any time with the <b>🎓 Tutorial</b> button at the bottom.',f:['Tap <b>🎉 Finish</b> to close and start working.','Want a refresher? Use the jump menu to revisit any step.']});
 return S}

let STEPS=[],cur=0,state='closed',owned=[],hlEls=[];
const btn=document.createElement('button');btn.id='pbTutBtn';btn.type='button';btn.textContent='🎓 Tutorial';btn.setAttribute('aria-label','Open the guided tutorial');
let seenIt=false;try{seenIt=localStorage.getItem('pb-tut-seen')==='1'}catch(e){}if(!seenIt)btn.classList.add('pulse');
const box=document.createElement('div');box.id='pbTut';box.hidden=true;box.setAttribute('role','region');box.setAttribute('aria-label','Guided tutorial');
document.body.append(btn,box);

function unhl(){hlEls.forEach(e=>e.classList.remove('pb-hl'));hlEls=[]}
function hl(els,scroll){unhl();els.filter(Boolean).slice(0,14).forEach(e=>{e.classList.add('pb-hl');hlEls.push(e)});if(scroll&&hlEls[0]){try{hlEls[0].scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'})}catch(e){}}}
function closeOwned(){owned.forEach(w=>{if(w.isConnected){const x=w.querySelector('.tw-x');quiet++;try{x&&x.click()}finally{quiet--}}});owned=[]}
function openTool(id){const before=new Set(document.querySelectorAll('.tool-win'));quiet++;try{openToolModal(id)}catch(e){}finally{quiet--}
 const all=[...document.querySelectorAll('.tool-win')],nw=all.filter(w=>!before.has(w));if(nw.length){owned.push(...nw);return nw[nw.length-1]}
 return all.sort((a,b)=>(+b.style.zIndex||0)-(+a.style.zIndex||0))[0]||null}
function sidePanels(next){if(!(next&&next.sb)){const s=$('leftSidebar');if(s)s.classList.remove('open')}
 if(!(next&&next.an)){const p=document.querySelector('.an-panel');if(p)p.classList.remove('open')}}
function enter(){const s=STEPS[cur];try{if(s.pre)s.pre();if(s.run)s.run();if(s.tool){const w=openTool(s.tool);hl([w],false)}else if(s.sel)hl([...document.querySelectorAll(s.sel)],true);else unhl()}catch(e){}}
function leave(next){unhl();closeOwned();sidePanels(next)}
function fit(){try{document.body.style.setProperty('--pbtut-h',(state==='open'?box.offsetHeight:0)+'px');document.body.classList.toggle('pb-tut-on',state==='open')}catch(e){}}
function draw(){const s=STEPS[cur],n=STEPS.length;box.hidden=state==='closed';btn.hidden=state!=='closed';box.className=state==='min'?'min':'';
 if(state==='closed'){fit();return}
 if(state==='min'){box.innerHTML='<div class="tm"><button class="tb" data-tut="max" type="button" title="Resume the tutorial">🎓 Tutorial · '+(cur+1)+'/'+n+' · '+E(s.t)+'</button><button class="tx" data-tut="close" type="button" aria-label="Close tutorial">✕</button></div>';fit();return}
 box.innerHTML='<div class="th"><span class="tp">Step '+(cur+1)+' of '+n+'</span><span class="tc">'+E(s.cat)+'</span><span class="ts"><button data-tut="min" type="button" title="Minimize" aria-label="Minimize tutorial">➖</button><button data-tut="close" type="button" title="Close" aria-label="Close tutorial">✕</button></span></div>'
 +'<div class="tbar"><i style="width:'+((cur+1)/n*100)+'%"></i></div>'
 +'<div class="tbody"><div class="tti"><span class="tic">'+s.ico+'</span><b>'+E(s.t)+'</b></div><p>'+s.d+'</p><ul>'+s.f.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+(s.tool?'<button class="tbtn try" data-tut="again" type="button">🔄 Open this tool again</button>':'')+'</div>'
 +'<div class="tf"><button class="tbtn" data-tut="back" type="button"'+(cur?'':' disabled')+'>◀ Back</button><select data-tut="jump" aria-label="Jump to a step">'+STEPS.map((x,i)=>'<option value="'+i+'"'+(i===cur?' selected':'')+'>'+(i+1)+'. '+E(x.t)+'</option>').join('')+'</select><button class="tbtn on" data-tut="next" type="button">'+(cur===n-1?'🎉 Finish':'Continue ▶')+'</button></div>';
 fit();requestAnimationFrame(fit);const b=box.querySelector('.tbody');if(b)b.scrollTop=0}
function goTo(i){const nx=STEPS[Math.max(0,Math.min(STEPS.length-1,i))];leave(nx);cur=STEPS.indexOf(nx);enter();draw()}
function openTour(){if(!STEPS.length)STEPS=buildSteps();try{localStorage.setItem('pb-tut-seen','1')}catch(e){}btn.classList.remove('pulse');cur=0;state='open';sfx('open');enter();draw()}
function closeTour(){leave(null);state='closed';draw()}
btn.addEventListener('click',e=>{e.stopPropagation();openTour();burst(e.clientX,e.clientY,['🎓','✨'])});
box.addEventListener('click',e=>{const b=e.target.closest('[data-tut]');if(!b||b.tagName==='SELECT')return;const k=b.dataset.tut;
 if(k==='next'){if(cur>=STEPS.length-1){sfx('win');confetti(150);closeTour()}else{sfx('tab');goTo(cur+1)}}
 else if(k==='back'){sfx('click');goTo(cur-1)}
 else if(k==='min'){sfx('min');leave(null);state='min';draw()}
 else if(k==='max'){sfx('open');state='open';enter();draw()}
 else if(k==='close'){sfx('close');closeTour()}
 else if(k==='again'){sfx('open');const s=STEPS[cur];if(s.tool){const w=openTool(s.tool);hl([w],false)}}});
box.addEventListener('change',e=>{if(e.target.dataset.tut==='jump'){sfx('tick');goTo(+e.target.value)}});
document.addEventListener('keydown',e=>{if(state!=='open')return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||''))return;if(e.key==='ArrowRight'&&cur<STEPS.length-1){sfx('tab');goTo(cur+1)}else if(e.key==='ArrowLeft'&&cur>0){sfx('click');goTo(cur-1)}});
addEventListener('resize',fit);
})();
</script>
<script>
/* ===== PBU part 2: hero greeting line + auto-fill of every "your name" box ===== */
(()=>{'use strict';
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hi=document.createElement('p');hi.id='pbHi';hi.className='pbhi';hi.setAttribute('aria-live','polite');
const sub=document.querySelector('header.hero .sub');if(sub&&sub.parentNode)sub.parentNode.insertBefore(hi,sub.nextSibling);
let editing=false;
function drawHi(){if(editing||!hi.isConnected)return;const n=PBU.name();
 hi.innerHTML='<span class="pbw" role="button" tabindex="0" data-h="w" aria-label="Wave">👋</span> '+PBU.greet()+(n?', <button type="button" class="pbhn" data-h="e" title="'+E(PBU.label()?'Name '+PBU.label()+'. ':'')+'Tap to change your name">'+E(n)+'</button>':' <button type="button" class="pbhn" data-h="e">Add your name</button>')}
function editHi(){editing=true;hi.innerHTML=PBU.greet()+', <input class="pbin" maxlength="40" placeholder="Your name" aria-label="Your name" autocomplete="given-name" value="'+E(PBU.raw())+'"> <button type="button" class="pbhn" data-h="ok">Save</button>';
 const i=hi.querySelector('input');let done=false;const fin=ok=>{if(done)return;done=true;editing=false;if(ok){PBU.set(i.value);try{PBFX.sfx('ok')}catch(e){}}drawHi()};
 i.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')fin(true);else if(e.key==='Escape')fin(false)});
 i.addEventListener('blur',()=>setTimeout(()=>fin(true),150));hi._fin=fin;i.focus();i.select()}
hi.addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;const k=b.dataset.h;
 if(k==='e')editHi();else if(k==='ok'&&hi._fin)hi._fin(true);
 else if(k==='w'){b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig');try{PBFX.sfx('tick');PBFX.burst(e.clientX,e.clientY,['✨','👋','⭐'],6)}catch(x){}}});
hi.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.h==='w'){e.preventDefault();e.target.click()}});
PBU.on(drawHi);
setInterval(()=>{if(!document.hidden)drawHi()},600000);

/* pre-fill every "your name" box (announcements, trainer report, admin log); follows later name changes unless the person edited the box */
const FIELDS='input[data-s="nm"],#anAg,#anN,#ln2';
function fill(root){const n=PBU.full();if(!n||!root||root.nodeType!==1)return;
 const list=root.matches&&root.matches(FIELDS)?[root]:[...root.querySelectorAll(FIELDS)];
 list.forEach(i=>{if(document.activeElement===i)return;const cur=i.value,auto=i.dataset.pbf;
  if((!cur&&!auto)||(auto&&cur===auto&&cur!==n)){i.dataset.pbf=n;i.value=n;i.dispatchEvent(new Event('input',{bubbles:true}))}})}
let queue=new Set(),raf=0;
const flush=()=>{raf=0;const q=queue;queue=new Set();q.forEach(fill)};
new MutationObserver(ms=>{for(const m of ms)for(const x of m.addedNodes)if(x.nodeType===1)queue.add(x);if(queue.size&&!raf)raf=requestAnimationFrame(flush)}).observe(document.body,{childList:true,subtree:true});
PBU.on(()=>fill(document.body));
drawHi();fill(document.body);
})();
</script>
